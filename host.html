<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>👑 أوميجا - غرفة العمليات المركزية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --gold: #d4af37; --navy: #0a192f; --wine: #722f37; }
  body { font-family: 'Tajawal', sans-serif; background: var(--navy); color: #fff; margin: 0; display: flex; }
  
  /* القائمة الجانبية لإدارة الأسئلة */
  .sidebar { width: 300px; background: rgba(0,0,0,0.3); border-left: 1px solid var(--gold); height: 100vh; padding: 20px; overflow-y: auto; }
  .main-content { flex: 1; padding: 20px; }
  
  .card { background: rgba(255,255,255,0.05); border: 1px solid var(--gold); border-radius: 15px; padding: 20px; margin-bottom: 20px; }
  .btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
  .btn-gold { background: var(--gold); color: var(--navy); }
  .btn-danger { background: var(--wine); color: white; margin-top: 5px; }
  
  input, select { width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid var(--gold); background: #1a1a2e; color: white; }
  
  .live-feed { background: #000; color: #0f0; padding: 10px; font-family: monospace; height: 100px; overflow-y: auto; border-radius: 5px; border: 1px solid #333; margin-top: 10px; }
  .q-item { border-bottom: 1px solid #333; padding: 10px 0; font-size: 0.9rem; }
  .code-display { font-size: 3rem; color: var(--gold); font-weight: 900; }
</style>
</head>
<body>

<div class="sidebar">
  <h3>🛠 إدارة بنك الأسئلة</h3>
  <div class="card">
    <input type="text" id="newQ" placeholder="السؤال الجديد...">
    <input type="text" id="opt0" placeholder="الخيار 1 (الصح)">
    <input type="text" id="opt1" placeholder="الخيار 2">
    <input type="text" id="opt2" placeholder="الخيار 3">
    <input type="text" id="opt3" placeholder="الخيار 4">
    <button class="btn btn-gold" style="width:100%" onclick="addQuestion()">➕ إضافة للسلسلة</button>
  </div>
  <div id="questionsList"></div>
</div>

<div class="main-content">
  <div class="card" id="setupZone">
    <h1>لوحة تحكم محمد جابر 👑</h1>
    <button class="btn btn-gold" style="font-size:1.5rem" onclick="initRoom()">✨ إنشاء غرفة جديدة الآن</button>
  </div>

  <div id="gameZone" style="display:none">
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 20px;">
      <div class="card">
        <h2>كود الغرفة: <span class="code-display" id="roomOut">----</span></h2>
        <p id="pCount">اللاعبون المتصلون: 0</p>
        <button class="btn btn-gold" onclick="startGame()" id="startBtn">🚀 ابدأ اللعبة</button>
        <button class="btn btn-gold" onclick="nextQuestion()" id="nextBtn" style="display:none">السؤال التالي ⏭️</button>
      </div>
      
      <div class="card">
        <h3>🏆 المتصدرون (مباشر)</h3>
        <div id="leaderboard"></div>
      </div>
    </div>

    <div class="card">
      <h2 id="currentQText">انتظر دخول اللاعبين...</h2>
      <div class="live-feed" id="logs">📟 شريط الأحداث: جاهز...</div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
  import { getDatabase, ref, set, onValue, update, push, remove } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDxbPH1pEScwMuRlnUqvKatCfit6xq-MfY",
    authDomain: "qurnn-1c9c4.firebaseapp.com",
    databaseURL: "https://qurnn-1c9c4-default-rtdb.firebaseio.com",
    projectId: "qurnn-1c9c4",
    storageBucket: "qurnn-1c9c4.firebasestorage.app",
    messagingSenderId: "483393093513",
    appId: "1:483393093513:web:ae3ff0f67e6945a91b6b58"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  let room = "";
  let questions = [
    { q: "ما معنى الموعظة لغةً؟", opts: ["النصح", "الشدة", "القراءة", "التجاهل"], ans: 0 }
  ];
  let currentIdx = -1;

  // إدارة الأسئلة محلياً وعرضها
  window.addQuestion = function() {
    const q = document.getElementById('newQ').value;
    const o = [document.getElementById('opt0').value, document.getElementById('opt1').value, document.getElementById('opt2').value, document.getElementById('opt3').value];
    if(!q || !o[0]) return alert("عبّي السؤال والخيارات!");
    questions.push({ q, opts: o, ans: 0 });
    renderQuestions();
  };

  window.removeQuestion = function(i) {
    questions.splice(i, 1);
    renderQuestions();
  };

  function renderQuestions() {
    const list = document.getElementById('questionsList');
    list.innerHTML = "<h4>الأسئلة الحالية:</h4>";
    questions.forEach((q, i) => {
      list.innerHTML += `<div class="q-item">${i+1}. ${q.q} <br> <button class="btn btn-danger" onclick="removeQuestion(${i})">حذف</button></div>`;
    });
  }
  renderQuestions();

  // نظام الغرفة
  window.initRoom = function() {
    room = Math.floor(1000 + Math.random() * 9000).toString();
    set(ref(db, `rooms/${room}/state`), { status: "waiting", index: -1 });
    document.getElementById('setupZone').style.display = 'none';
    document.getElementById('gameZone').style.display = 'block';
    document.getElementById('roomOut').innerText = room;

    onValue(ref(db, `rooms/${room}/players`), (s) => {
      const p = s.val() || {};
      const sorted = Object.values(p).sort((a,b) => b.score - a.score);
      document.getElementById('pCount').innerText = `اللاعبون المتصلون: ${Object.keys(p).length}`;
      document.getElementById('leaderboard').innerHTML = sorted.slice(0,5).map(x => `<div>${x.name}: ${x.score}</div>`).join('');
    });

    onValue(ref(db, `rooms/${room}/logs`), (s) => {
      if(s.exists()) {
        const logBox = document.getElementById('logs');
        logBox.innerHTML += `<div>> ${s.val().msg}</div>`;
        logBox.scrollTop = logBox.scrollHeight;
      }
    });
  };

  window.startGame = function() {
    if(questions.length === 0) return alert("اضف اسئلة اولاً!");
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('nextBtn').style.display = 'inline-block';
    nextQuestion();
  };

  window.nextQuestion = function() {
    currentIdx++;
    if(currentIdx < questions.length) {
      const q = questions[currentIdx];
      update(ref(db, `rooms/${room}/state`), {
        status: "playing",
        index: currentIdx,
        qText: q.q,
        options: q.opts
      });
      document.getElementById('currentQText').innerText = `السؤال ${currentIdx+1}: ${q.q}`;
    } else {
      document.getElementById('currentQText').innerText = "🏁 انتهت الأسئلة!";
      update(ref(db, `rooms/${room}/state`), { status: "ended" });
    }
  };
</script>
</body>
</html>
