<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>👑 أوميجا - الإدارة الاحترافية (محمد وبهاء)</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --gold: #d4af37; --navy: #0a192f; --wine: #c0392b; }
  body { font-family: 'Tajawal', sans-serif; background: var(--navy); color: #fff; margin: 0; display: flex; height: 100vh; overflow: hidden; }
  .sidebar { width: 350px; background: rgba(0,0,0,0.4); border-left: 2px solid var(--gold); padding: 20px; overflow-y: auto; }
  .main-content { flex: 1; padding: 30px; overflow-y: auto; }
  .card { background: rgba(255,255,255,0.05); border: 1px solid var(--gold); border-radius: 15px; padding: 20px; margin-bottom: 20px; }
  .btn { padding: 12px 20px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; width: 100%; font-family: 'Tajawal'; }
  .btn-gold { background: var(--gold); color: var(--navy); margin-top: 10px; }
  .btn-danger { background: var(--wine); color: white; width: auto; padding: 5px 15px; font-size: 0.8rem; margin-top: 10px; }
  input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid var(--gold); background: #1a1a2e; color: white; box-sizing: border-box; }
  .q-item { background: rgba(255,255,255,0.03); border-radius: 10px; padding: 15px; margin-bottom: 15px; border-right: 4px solid var(--gold); position: relative; }
  .code-display { font-size: 4rem; color: var(--gold); font-weight: 900; }
</style>
</head>
<body>

<div class="sidebar">
  <h2 style="color:var(--gold); text-align:center;">🛠 بنك الأسئلة المشترك</h2>
  <div class="card">
    <input type="text" id="newQ" placeholder="نص السؤال...">
    <input type="text" id="opt0" placeholder="الإجابة الصحيحة ✅">
    <input type="text" id="opt1" placeholder="خيار خطأ 1">
    <input type="text" id="opt2" placeholder="خيار خطأ 2">
    <input type="text" id="opt3" placeholder="خيار خطأ 3">
    <button class="btn btn-gold" onclick="saveQuestionToDB()">💾 حفظ في السحاب</button>
  </div>
  <div id="questionsList">جاري التحميل...</div>
</div>

<div class="main-content">
  <div class="card" id="setupZone">
    <h1>لوحة تحكم أوميجا 👑</h1>
    <p>أهلاً بك وببهاء في النظام السحابي</p>
    <button class="btn btn-gold" style="padding: 25px; font-size: 1.5rem;" onclick="initRoom()">✨ إنشاء غرفة جديدة</button>
  </div>

  <div id="gameZone" style="display:none">
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 20px;">
      <div class="card">
        <h3>كود الغرفة:</h3>
        <div class="code-display" id="roomOut">----</div>
        <p id="pCount">اللاعبون: 0</p>
        <button class="btn btn-gold" onclick="startGame()" id="startBtn">🚀 ابدأ اللعبة</button>
        <button class="btn btn-gold" onclick="nextQuestion()" id="nextBtn" style="display:none; background:#27ae60; color:white;">السؤال التالي ⏭️</button>
      </div>
      <div class="card">
        <h3 style="color:var(--gold)">🏆 المتصدرون</h3>
        <div id="leaderboard"></div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
  import { getDatabase, ref, set, onValue, update, push, remove } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDxbPH1pEScwMuRlnUqvKatCfit6xq-MfY",
    authDomain: "qurnn-1c9c4.firebaseapp.com",
    databaseURL: "https://qurnn-1c9c4-default-rtdb.firebaseio.com",
    projectId: "qurnn-1c9c4",
    storageBucket: "qurnn-1c9c4.firebasestorage.app",
    messagingSenderId: "483393093513",
    appId: "1:483393093513:web:ae3ff0f67e6945a91b6b58"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  let questionsData = [];

  // --- أهم جزء: جلب الأسئلة من السيرفر ---
  onValue(ref(db, 'admin/questions'), (snapshot) => {
    const data = snapshot.val();
    // تحويل البيانات لصفوف مع الحفاظ على الـ ID الخاص بكل سؤال للحذف
    questionsData = data ? Object.entries(data) : []; 
    renderQuestions();
  });

  // --- وظيفة الحذف من السيرفر (الجذرية) ---
  window.deleteQ = function(questionID) {
    if(confirm("هل أنت متأكد من حذف السؤال نهائياً من السحاب؟")) {
      // هذه السطر يمسح السؤال من قاعدة البيانات للأبد
      remove(ref(db, `admin/questions/${questionID}`))
      .then(() => console.log("تم الحذف بنجاح"))
      .catch((err) => alert("خطأ في الحذف: " + err));
    }
  };

  window.saveQuestionToDB = function() {
    const q = document.getElementById('newQ').value;
    const opts = [document.getElementById('opt0').value, document.getElementById('opt1').value, document.getElementById('opt2').value, document.getElementById('opt3').value];
    if(!q || !opts[0]) return alert("أكمل البيانات!");

    const qRef = push(ref(db, 'admin/questions'));
    set(qRef, { q, opts }).then(() => {
        document.querySelectorAll('.sidebar input').forEach(i => i.value = "");
    });
  };

  function renderQuestions() {
    const list = document.getElementById('questionsList');
    if(questionsData.length === 0) {
        list.innerHTML = "<p style='opacity:0.5; text-align:center;'>البنك فارغ</p>";
        return;
    }
    list.innerHTML = questionsData.map(([id, data]) => `
      <div class="q-item">
        <strong>${data.q}</strong><br>
        <button class="btn btn-danger" onclick="deleteQ('${id}')">🗑 حذف نهائي</button>
      </div>
    `).join('');
  }

  // --- وظائف الغرفة ---
  window.initRoom = function() {
    const room = Math.floor(1000 + Math.random() * 9000).toString();
    set(ref(db, `rooms/${room}/state`), { status: "waiting", index: -1 });
    document.getElementById('setupZone').style.display = 'none';
    document.getElementById('gameZone').style.display = 'block';
    document.getElementById('roomOut').innerText = room;
  };
</script>
</body>
</html>
