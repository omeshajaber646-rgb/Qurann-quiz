<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>👑 أوميجا - لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --gold: #d4af37; --navy: #0a192f; }
  body { font-family: 'Tajawal', sans-serif; background: var(--navy); color: #fff; text-align: center; margin: 0; }
  .setup-screen { padding: 100px 20px; }
  .btn { padding: 20px 40px; border-radius: 50px; border: none; font-weight: 900; cursor: pointer; font-size: 1.5rem; background: var(--gold); color: var(--navy); }
  .room-info { display:none; padding: 40px; border: 2px solid var(--gold); border-radius: 20px; margin: 20px auto; max-width: 600px; }
  .code { font-size: 5rem; font-weight: 900; color: var(--gold); }
</style>
</head>
<body>

<div class="setup-screen" id="setup">
  <h1 style="color:var(--gold); font-size: 4rem;">OMEGA CONTROL</h1>
  <button class="btn" onclick="initRoom()">✨ إنشاء غرفة جديدة الآن</button>
</div>

<div id="gamePanel" class="room-info">
  <h2>كود الغرفة للطلاب:</h2>
  <div class="code" id="codeOut">----</div>
  <p id="pCount">اللاعبون: 0</p>
  <button class="btn" id="startBtn" onclick="start()" style="background:#2ecc71; color:#fff; display:none;">ابدأ اللعبة 🚀</button>
  <div id="qText" style="font-size: 2rem; margin-top: 20px;"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
  import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDxbPH1pEScwMuRlnUqvKatCfit6xq-MfY",
    authDomain: "qurnn-1c9c4.firebaseapp.com",
    databaseURL: "https://qurnn-1c9c4-default-rtdb.firebaseio.com",
    projectId: "qurnn-1c9c4",
    storageBucket: "qurnn-1c9c4.firebasestorage.app",
    messagingSenderId: "483393093513",
    appId: "1:483393093513:web:ae3ff0f67e6945a91b6b58"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  let room = "";

  window.initRoom = function() {
    room = Math.floor(1000 + Math.random() * 9000).toString();
    set(ref(db, `rooms/${room}/state`), { status: "waiting", index: -1 });
    
    document.getElementById('setup').style.display = 'none';
    document.getElementById('gamePanel').style.display = 'block';
    document.getElementById('codeOut').innerText = room;
    document.getElementById('startBtn').style.display = 'inline-block';

    onValue(ref(db, `rooms/${room}/players`), (s) => {
      const count = s.exists() ? Object.keys(s.val()).length : 0;
      document.getElementById('pCount').innerText = `اللاعبون المتصلون: ${count}`;
    });
  };

  window.start = function() {
    update(ref(db, `rooms/${room}/state`), { status: "playing", index: 0 });
    document.getElementById('qText').innerText = "بدأت اللعبة على هواتف الطلاب! 🔥";
  };
</script>
</body>
</html>
