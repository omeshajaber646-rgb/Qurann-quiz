<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>👑 أوميجا - الإدارة السحابية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --navy: #0a192f; }
        body { font-family: 'Tajawal', sans-serif; background: var(--navy); color: #fff; margin: 0; display: flex; height: 100vh; }
        .sidebar { width: 350px; background: rgba(0,0,0,0.5); border-left: 2px solid var(--gold); padding: 20px; overflow-y: auto; }
        .main { flex: 1; padding: 30px; }
        .card { background: rgba(255,255,255,0.05); border: 1px solid var(--gold); border-radius: 15px; padding: 15px; margin-bottom: 15px; }
        input { width: 100%; padding: 10px; margin: 5px 0; border-radius: 8px; border: 1px solid var(--gold); background: #1a1a2e; color: #fff; }
        .btn { width: 100%; padding: 12px; border-radius: 10px; border: none; cursor: pointer; background: var(--gold); color: var(--navy); font-weight: bold; margin-top: 10px; }
        .q-item { background: rgba(255,255,255,0.03); padding: 10px; margin-bottom: 10px; border-radius: 8px; border-right: 4px solid var(--gold); }
    </style>
</head>
<body>

<div class="sidebar">
    <h2 style="color:var(--gold); text-align:center;">بنك الأسئلة المشترك ☁️</h2>
    <div class="card">
        <input type="text" id="newQ" placeholder="السؤال...">
        <input type="text" id="opt0" placeholder="الجواب الصح ✅">
        <input type="text" id="opt1" placeholder="خطأ 1">
        <input type="text" id="opt2" placeholder="خطأ 2">
        <input type="text" id="opt3" placeholder="خطأ 3">
        <button class="btn" onclick="saveToFirebase()">💾 حفظ دائم (للكل)</button>
    </div>
    <div id="questionsList">جاري المزامنة...</div>
</div>

<div class="main">
    <div class="card">
        <h1>لوحة تحكم محمد وبهاء 👑</h1>
        <div id="syncIndicator" style="color: orange;">جاري الفحص... ⏳</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, push, remove } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-database.js";

    // إعداداتك الصحيحة
    const firebaseConfig = {
        apiKey: "AIzaSyDxbPH1pEScwMuRlnUqvKatCfit6xq-MfY",
        authDomain: "qurnn-1c9c4.firebaseapp.com",
        databaseURL: "https://qurnn-1c9c4-default-rtdb.firebaseio.com",
        projectId: "qurnn-1c9c4",
        storageBucket: "qurnn-1c9c4.firebasestorage.app",
        messagingSenderId: "483393093513",
        appId: "1:483393093513:web:ae3ff0f67e6945a91b6b58"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // فحص الاتصال
    onValue(ref(db, '.info/connected'), (snap) => {
        const status = document.getElementById('syncIndicator');
        if (snap.val() === true) {
            status.innerText = "متصل بالسحاب ✅ (جاهز للإضافة)";
            status.style.color = "#2ecc71";
        } else {
            status.innerText = "غير متصل! افحص الإنترنت ❌";
            status.style.color = "#ff4757";
        }
    });

    // جلب الأسئلة وعرضها (بتحديث حي)
    onValue(ref(db, 'global_questions'), (snapshot) => {
        const listDiv = document.getElementById('questionsList');
        const data = snapshot.val();
        listDiv.innerHTML = "";
        if(!data) { listDiv.innerHTML = "لا يوجد أسئلة في السحاب."; return; }

        Object.entries(data).forEach(([id, q]) => {
            listDiv.innerHTML += `
                <div class="q-item">
                    <strong>${q.text}</strong>
                    <button onclick="deleteQ('${id}')" style="background:red; color:white; border:none; padding:3px 10px; cursor:pointer; float:left;">حذف</button>
                    <div style="clear:both"></div>
                </div>`;
        });
    });

    window.saveToFirebase = function() {
        const text = document.getElementById('newQ').value;
        const o0 = document.getElementById('opt0').value;
        if(!text || !o0) return alert("عبّي البيانات يا بطل!");

        const newQRef = push(ref(db, 'global_questions'));
        set(newQRef, {
            text: text,
            options: [o0, document.getElementById('opt1').value, document.getElementById('opt2').value, document.getElementById('opt3').value]
        }).then(() => {
            alert("✅ تم الحفظ بنجاح! هسا المفروض بينت عند بهاء.");
            document.querySelectorAll('input').forEach(i => i.value = "");
        }).catch((error) => {
            alert("❌ فشل الحفظ! السبب: " + error.message);
        });
    };

    window.deleteQ = function(id) {
        if(confirm("حذف نهائي؟")) remove(ref(db, `global_questions/${id}`));
    };
</script>
</body>
</html>
