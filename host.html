<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 لوحة التحكم - الهوست</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Tajawal', sans-serif;
    background: #0a0a1a;
    color: #fff;
    min-height: 100vh;
  }
  .bg-grid {
    position: fixed; inset: 0; z-index: 0;
    background-image: linear-gradient(rgba(99,102,241,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(99,102,241,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .container { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 20px; }

  /* Header */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px; padding: 16px 24px; margin-bottom: 24px;
    backdrop-filter: blur(10px);
  }
  .logo { font-size: 24px; font-weight: 900; }
  .logo span { color: #6366f1; }
  .host-badge {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    padding: 6px 16px; border-radius: 999px; font-size: 13px; font-weight: 700;
  }

  /* Room code */
  .room-card {
    background: linear-gradient(135deg, #1e1e3a, #2d1b69);
    border: 2px solid #6366f1;
    border-radius: 20px; padding: 28px; margin-bottom: 24px; text-align: center;
    position: relative; overflow: hidden;
  }
  .room-card::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 0%, rgba(99,102,241,0.2), transparent 60%);
  }
  .room-label { font-size: 14px; color: #a5b4fc; margin-bottom: 8px; letter-spacing: 2px; text-transform: uppercase; }
  .room-code {
    font-size: 72px; font-weight: 900; letter-spacing: 16px;
    background: linear-gradient(135deg, #fff, #a5b4fc);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-shadow: none; line-height: 1;
  }
  .room-url { font-size: 13px; color: #6366f1; margin-top: 12px; word-break: break-all; }
  .new-room-btn {
    margin-top: 16px; background: rgba(99,102,241,0.2); border: 1px solid #6366f1;
    color: #a5b4fc; padding: 10px 24px; border-radius: 999px;
    cursor: pointer; font-family: 'Tajawal', sans-serif; font-size: 14px;
    transition: all 0.2s;
  }
  .new-room-btn:hover { background: #6366f1; color: #fff; }

  /* Players */
  .section-title { font-size: 18px; font-weight: 700; margin-bottom: 14px; color: #a5b4fc; }
  .players-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px; margin-bottom: 24px; min-height: 80px;
  }
  .player-chip {
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px; padding: 12px; text-align: center;
    animation: popIn 0.3s ease;
  }
  .player-chip .avatar { font-size: 28px; }
  .player-chip .name { font-size: 13px; margin-top: 4px; font-weight: 700; }
  .player-chip .score { font-size: 11px; color: #a5b4fc; }
  @keyframes popIn {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .waiting-text { color: #4b5563; font-size: 14px; text-align: center; padding: 20px; width: 100%; }

  /* Questions */
  .questions-panel {
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px; padding: 24px; margin-bottom: 24px;
  }
  .q-list { display: flex; flex-direction: column; gap: 10px; }
  .q-item {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; transition: all 0.2s;
  }
  .q-item:hover { background: rgba(99,102,241,0.15); border-color: #6366f1; }
  .q-item.active { background: rgba(99,102,241,0.25); border-color: #6366f1; border-width: 2px; }
  .q-item.done { opacity: 0.4; }
  .q-num {
    width: 32px; height: 32px; background: #6366f1; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 14px; flex-shrink: 0; margin-left: 12px;
  }
  .q-text { flex: 1; font-size: 14px; line-height: 1.4; }
  .q-pts { font-size: 12px; color: #f59e0b; font-weight: 700; }

  /* Controls */
  .controls { display: flex; gap: 12px; flex-wrap: wrap; }
  .btn-main {
    flex: 1; min-width: 160px; padding: 16px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    border: none; border-radius: 14px; color: #fff;
    font-family: 'Tajawal', sans-serif; font-size: 18px; font-weight: 900;
    cursor: pointer; transition: all 0.2s;
  }
  .btn-main:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(99,102,241,0.4); }
  .btn-main:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn-end {
    padding: 16px 24px; background: rgba(239,68,68,0.15);
    border: 1px solid #ef4444; border-radius: 14px; color: #ef4444;
    font-family: 'Tajawal', sans-serif; font-size: 16px; font-weight: 700;
    cursor: pointer; transition: all 0.2s;
  }
  .btn-end:hover { background: #ef4444; color: #fff; }

  /* Current Q display */
  .current-q {
    background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(139,92,246,0.15));
    border: 2px solid #6366f1; border-radius: 20px; padding: 24px; margin-bottom: 24px;
    display: none;
  }
  .current-q.visible { display: block; animation: slideDown 0.4s ease; }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  .current-q-label { font-size: 12px; color: #a5b4fc; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }
  .current-q-text { font-size: 22px; font-weight: 700; margin-bottom: 16px; }
  .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opt {
    padding: 12px 16px; border-radius: 12px; font-size: 15px; font-weight: 700;
    display: flex; align-items: center; gap: 10px;
  }
  .opt-A { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; }
  .opt-B { background: rgba(59,130,246,0.2); border: 1px solid #3b82f6; }
  .opt-C { background: rgba(234,179,8,0.2); border: 1px solid #eab308; }
  .opt-D { background: rgba(34,197,94,0.2); border: 1px solid #22c55e; }
  .opt-icon { font-size: 20px; }
  .correct-badge { background: #22c55e; color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 999px; }

  /* Timer */
  .timer-bar {
    height: 6px; background: rgba(255,255,255,0.1); border-radius: 999px;
    margin-top: 16px; overflow: hidden;
  }
  .timer-fill {
    height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, #22c55e, #eab308, #ef4444);
    transition: width 1s linear;
  }
  .timer-text { text-align: center; font-size: 14px; color: #a5b4fc; margin-top: 6px; }

  /* Answers count */
  .answers-count { font-size: 14px; color: #a5b4fc; margin-top: 8px; text-align: center; }

  /* Leaderboard */
  .leaderboard {
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px; padding: 24px; margin-bottom: 24px;
  }
  .lb-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px; border-radius: 12px; margin-bottom: 8px;
    background: rgba(255,255,255,0.04);
    transition: all 0.3s;
  }
  .lb-item.top { background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.3); }
  .lb-rank { font-size: 20px; width: 36px; text-align: center; }
  .lb-name { flex: 1; font-weight: 700; }
  .lb-score { font-size: 18px; font-weight: 900; color: #fbbf24; }

  /* Status */
  .status-bar {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.05); border-radius: 999px;
    padding: 8px 16px; margin-bottom: 24px; width: fit-content;
  }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .status-text { font-size: 13px; color: #a5b4fc; }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="container">

  <div class="header">
    <div class="logo">كوِيز<span>لايف</span></div>
    <div class="host-badge">🎮 الهوست</div>
  </div>

  <div class="room-card">
    <div class="room-label">كود الغرفة</div>
    <div class="room-code" id="roomCode">----</div>
    <div class="room-url" id="roomUrl"></div>
    <button class="new-room-btn" onclick="newRoom()">🔄 غرفة جديدة</button>
  </div>

  <div class="status-bar">
    <div class="status-dot"></div>
    <div class="status-text" id="statusText">في انتظار اللاعبين...</div>
  </div>

  <div class="section-title">👥 اللاعبون (<span id="playerCount">0</span>)</div>
  <div class="players-grid" id="playersGrid">
    <div class="waiting-text">لا يوجد لاعبون بعد...</div>
  </div>

  <div class="current-q" id="currentQBox">
    <div class="current-q-label">السؤال الحالي</div>
    <div class="current-q-text" id="currentQText"></div>
    <div class="options-grid" id="currentOpts"></div>
    <div class="timer-bar"><div class="timer-fill" id="timerFill" style="width:100%"></div></div>
    <div class="timer-text">الوقت المتبقي: <span id="timerSec">20</span> ثانية</div>
    <div class="answers-count" id="answersCount"></div>
  </div>

  <div class="questions-panel">
    <div class="section-title">📋 الأسئلة</div>
    <div class="q-list" id="qList"></div>
  </div>

  <div class="controls">
    <button class="btn-main" id="sendBtn" onclick="sendQuestion()" disabled>📤 أرسل السؤال التالي</button>
    <button class="btn-end" onclick="endGame()">🏁 إنهاء اللعبة</button>
  </div>

  <br>
  <div class="leaderboard" id="leaderboard" style="display:none">
    <div class="section-title">🏆 الترتيب</div>
    <div id="lbList"></div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, get, onValue, remove, push, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDxbPH1pEScwMuRlnUqvKatCfit6xq-MfY",
  authDomain: "qurnn-1c9c4.firebaseapp.com",
  databaseURL: "https://qurnn-1c9c4-default-rtdb.firebaseio.com",
  projectId: "qurnn-1c9c4",
  storageBucket: "qurnn-1c9c4.firebasestorage.app",
  messagingSenderId: "483393093513",
  appId: "1:483393093513:web:ae3ff0f67e6945a91b6b58",
  measurementId: "G-6BQ0HGZ3N1"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ===== الأسئلة من البريزنتيشن =====
const questions = [
  {
    q: "ما معنى كلمة «الموعظة» لغةً؟",
    opts: ["النصح والتذكير بعواقب الأمور", "الأمر بالمعروف والنهي عن المنكر", "قراءة القرآن الكريم", "الصلاة والذكر"],
    correct: 0, pts: 10
  },
  {
    q: "في أي سورة وردت الآية: ﴿يَا أَيُّهَا النَّاسُ قَدْ جَاءَتْكُم مَّوْعِظَةٌ مِّن رَّبِّكُمْ﴾؟",
    opts: ["سورة البقرة", "سورة يونس", "سورة لقمان", "سورة يوسف"],
    correct: 1, pts: 10
  },
  {
    q: "ما هي الوصية الأولى التي ذكرها لقمان لابنه؟",
    opts: ["بر الوالدين", "إقامة الصلاة", "توحيد الله وعدم الشرك", "حسن الخلق"],
    correct: 2, pts: 10
  },
  {
    q: "ماذا قال لقمان عن الشرك بالله في الآية الكريمة؟",
    opts: ["إنه حرام شديد", "إنه ظلم عظيم", "إنه ذنب كبير", "إنه خطأ فادح"],
    correct: 1, pts: 10
  },
  {
    q: "ما الوصية الثانية التي وردت في سورة لقمان؟",
    opts: ["حسن الخلق", "إقامة الصلاة", "توحيد الله", "بر الوالدين"],
    correct: 3, pts: 10
  },
  {
    q: "الموعظة في القرآن الكريم ليست مجرد نصيحة عابرة، بل هي منهج...",
    opts: ["سياسي متكامل", "رباني متكامل", "اجتماعي متكامل", "تربوي خاص"],
    correct: 1, pts: 10
  },
  {
    q: "ما الفائدة من الموعظة بالقصص في القرآن الكريم؟",
    opts: ["الترفيه والتسلية", "أخذ العبرة والاتعاظ", "حفظ التاريخ", "تعليم اللغة"],
    correct: 1, pts: 10
  },
  {
    q: "ما الوصية الثالثة في سورة لقمان؟",
    opts: ["حسن الخلق", "بر الوالدين", "إقامة الصلاة والأمر بالمعروف", "الصدق والأمانة"],
    correct: 2, pts: 10
  },
  {
    q: "ما الذي يجلبه التواضع وترك الكبر حسب سورة لقمان؟",
    opts: ["المال والثروة", "محبة الله وقبول الناس", "القوة والسلطة", "العلم والحكمة"],
    correct: 1, pts: 10
  },
  {
    q: "ما أسلوب الموعظة بالترغيب والترهيب في القرآن؟",
    opts: ["ذكر قصص الأنبياء فقط", "تحفيز النفس بذكر الجنة وتحذيرها بذكر النار", "الأمر المباشر بالطاعة", "النهي عن المعاصي فقط"],
    correct: 1, pts: 10
  }
];

let currentRoom = null;
let currentQIndex = -1;
let timerInterval = null;
let timeLeft = 20;
let answersReceived = 0;
let totalPlayers = 0;

const avatars = ['🦁','🐯','🦊','🐺','🦄','🐉','🦅','🦋','🐬','🦈','🦁','🎯'];

function generateCode() {
  return Math.floor(1000 + Math.random() * 9000).toString();
}

window.newRoom = async function() {
  if (currentRoom) await remove(ref(db, `rooms/${currentRoom}`));
  currentRoom = generateCode();
  document.getElementById('roomCode').textContent = currentRoom;
  const playerUrl = window.location.href.replace('host.html', 'player.html') + '?room=' + currentRoom;
  document.getElementById('roomUrl').textContent = '🔗 رابط اللاعبين: ' + playerUrl;
  currentQIndex = -1;
  answersReceived = 0;

  await set(ref(db, `rooms/${currentRoom}`), {
    status: 'waiting',
    currentQ: -1,
    createdAt: Date.now()
  });

  listenToRoom();
  renderQuestions();
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('currentQBox').classList.remove('visible');
  document.getElementById('leaderboard').style.display = 'none';
  document.getElementById('statusText').textContent = 'في انتظار اللاعبين...';
};

function listenToRoom() {
  onValue(ref(db, `rooms/${currentRoom}/players`), (snap) => {
    const players = snap.val() || {};
    const list = Object.values(players);
    totalPlayers = list.length;
    document.getElementById('playerCount').textContent = totalPlayers;
    renderPlayers(list);
    updateLeaderboard(list);
    if (timerInterval) {
      answersReceived = list.filter(p => p.lastAnswer === currentQIndex).length;
      document.getElementById('answersCount').textContent = `✅ أجاب ${answersReceived} من ${totalPlayers}`;
    }
  });
}

function renderPlayers(list) {
  const grid = document.getElementById('playersGrid');
  if (list.length === 0) {
    grid.innerHTML = '<div class="waiting-text">لا يوجد لاعبون بعد...</div>';
    return;
  }
  grid.innerHTML = list.map((p, i) => `
    <div class="player-chip">
      <div class="avatar">${avatars[i % avatars.length]}</div>
      <div class="name">${p.name}</div>
      <div class="score">${p.score || 0} نقطة</div>
    </div>
  `).join('');
}

function renderQuestions() {
  const list = document.getElementById('qList');
  list.innerHTML = questions.map((q, i) => `
    <div class="q-item ${i === currentQIndex ? 'active' : ''} ${i < currentQIndex ? 'done' : ''}" id="qi${i}">
      <div class="q-num">${i + 1}</div>
      <div class="q-text">${q.q}</div>
      <div class="q-pts">+${q.pts}</div>
    </div>
  `).join('');
}

window.sendQuestion = async function() {
  if (!currentRoom) return;
  currentQIndex++;
  if (currentQIndex >= questions.length) {
    endGame(); return;
  }

  clearInterval(timerInterval);
  answersReceived = 0;
  const q = questions[currentQIndex];

  await set(ref(db, `rooms/${currentRoom}/currentQuestion`), {
    index: currentQIndex,
    question: q.q,
    options: q.opts,
    correct: q.correct,
    pts: q.pts,
    startTime: Date.now(),
    timeLimit: 20
  });
  await update(ref(db, `rooms/${currentRoom}`), { status: 'playing', currentQ: currentQIndex });

  showCurrentQ(q);
  renderQuestions();
  startTimer();
  document.getElementById('statusText').textContent = `سؤال ${currentQIndex + 1} من ${questions.length}`;
  if (currentQIndex + 1 >= questions.length) {
    document.getElementById('sendBtn').textContent = '🏁 إنهاء اللعبة';
  }
};

function showCurrentQ(q) {
  document.getElementById('currentQText').textContent = q.q;
  const colors = ['opt-A','opt-B','opt-C','opt-D'];
  const icons = ['🔴','🔵','🟡','🟢'];
  document.getElementById('currentOpts').innerHTML = q.opts.map((o, i) => `
    <div class="opt ${colors[i]}">
      <span class="opt-icon">${icons[i]}</span>
      <span>${o}</span>
      ${i === q.correct ? '<span class="correct-badge">✓ صح</span>' : ''}
    </div>
  `).join('');
  document.getElementById('currentQBox').classList.add('visible');
  document.getElementById('answersCount').textContent = `✅ أجاب 0 من ${totalPlayers}`;
}

function startTimer() {
  timeLeft = 20;
  document.getElementById('timerSec').textContent = timeLeft;
  document.getElementById('timerFill').style.width = '100%';
  timerInterval = setInterval(() => {
    timeLeft--;
    document.getElementById('timerSec').textContent = timeLeft;
    document.getElementById('timerFill').style.width = (timeLeft / 20 * 100) + '%';
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      document.getElementById('statusText').textContent = 'انتهى الوقت! ⏰';
    }
  }, 1000);
}

function updateLeaderboard(list) {
  const sorted = [...list].sort((a, b) => (b.score || 0) - (a.score || 0));
  const medals = ['🥇','🥈','🥉'];
  document.getElementById('lbList').innerHTML = sorted.slice(0, 5).map((p, i) => `
    <div class="lb-item ${i === 0 ? 'top' : ''}">
      <div class="lb-rank">${medals[i] || (i + 1)}</div>
      <div class="lb-name">${p.name}</div>
      <div class="lb-score">${p.score || 0}</div>
    </div>
  `).join('');
  document.getElementById('leaderboard').style.display = 'block';
}

window.endGame = async function() {
  clearInterval(timerInterval);
  if (currentRoom) {
    await update(ref(db, `rooms/${currentRoom}`), { status: 'ended' });
  }
  document.getElementById('statusText').textContent = '🏁 انتهت اللعبة!';
  document.getElementById('sendBtn').disabled = true;
};

// Start with a room
newRoom();
</script>
</body>
</html>
