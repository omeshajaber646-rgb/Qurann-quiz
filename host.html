<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>👑 لوحة تحكم أوميجا - محمد جابر</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --gold: #d4af37; --navy: #0a192f; --wine: #722f37; }
  body { font-family: 'Tajawal', sans-serif; background: var(--navy); color: #fff; margin: 0; text-align: center; }
  .container { max-width: 900px; margin: auto; padding: 20px; }
  .room-box { background: rgba(212,175,55,0.1); padding: 20px; border-radius: 15px; border: 2px solid var(--gold); margin-bottom: 20px; }
  .q-card { background: rgba(255,255,255,0.05); padding: 40px; border-radius: 20px; border: 1px solid var(--gold); position: relative; }
  .timer-bar { height: 8px; background: var(--gold); width: 100%; position: absolute; bottom: 0; left: 0; transition: width 1s linear; }
  .btn { padding: 15px 30px; border-radius: 50px; border: none; font-weight: 900; cursor: pointer; margin: 10px; font-size: 1.1rem; }
  .btn-next { background: var(--gold); color: var(--navy); }
  .btn-steal { background: var(--wine); color: white; }
  
  /* لوحة السرقة اليدوية */
  #stealPanel { display:none; background: rgba(0,0,0,0.9); position: fixed; inset: 0; z-index: 999; padding: 50px; }
  .player-list-item { background: rgba(255,255,255,0.1); padding: 10px; margin: 5px; display: flex; justify-content: space-between; align-items: center; border-radius: 10px; }
</style>
</head>
<body>

<div class="container">
  <h1 style="color: var(--gold); font-size: 3rem;">OMEGA CONTROL</h1>
  
  <div class="room-box">
    <h2>كود الغرفة الجديد: <span id="roomCode" style="color: #fff; font-size: 2.5rem;">جاري الإنشاء...</span></h2>
    <p>أعطِ هذا الكود للطلاب للدخول</p>
  </div>

  <div class="q-card">
    <h2 id="qText">انتظر دخول الطلاب ثم ابدأ اللعبة</h2>
    <div id="opts" style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px;"></div>
    <div class="timer-bar" id="timerBar"></div>
  </div>

  <div class="controls">
    <button class="btn btn-next" onclick="nextQuestion()">إطلاق السؤال التالي 🚀</button>
    <button class="btn btn-steal" onclick="openStealPanel()">فتح قائمة السرقة 🥷</button>
  </div>

  <div id="leaderboard" style="margin-top: 30px;">
    <h3 style="color: var(--gold);">المتصدرون (تظهر للجميع الآن) 🏆</h3>
    <div id="lbItems"></div>
  </div>
</div>

<div id="stealPanel">
  <h2 style="color: var(--gold);">من تريد أن تسرق؟ 🥷</h2>
  <div id="playerStealList"></div>
  <button class="btn" onclick="document.getElementById('stealPanel').style.display='none'" style="background:#666;">إغلاق</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
  import { getDatabase, ref, set, onValue, update, increment } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-database.js";

  const firebaseConfig = { /* بياناتك هنا */ };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // إنشاء كود غرفة عشوائي من 4 أرقام
  const roomID = Math.floor(1000 + Math.random() * 9000).toString();
  document.getElementById('roomCode').innerText = roomID;

  let questions = [
    { q: "ما هو تعريف الموعظة لغةً؟", opts: ["النصح والتذكير", "الشدة", "القراءة", "التجاهل"], ans: 0 },
    { q: "في أي سورة وردت آية (وشفاء لما في الصدور)؟", opts: ["البقرة", "يونس", "لقمان", "يوسف"], ans: 1 }
  ];
  let currentIdx = -1;
  let playersData = {};

  // تهيئة حالة الغرفة
  set(ref(db, `rooms/${roomID}/state`), { status: "waiting", index: -1, showLeaderboard: false });

  window.nextQuestion = function() {
    currentIdx++;
    if(currentIdx < questions.length) {
      set(ref(db, `rooms/${roomID}/state`), {
        status: "playing",
        index: currentIdx,
        showLeaderboard: false // إخفاء المتصدرين لبدء سؤال جديد
      });
      document.getElementById('qText').innerText = questions[currentIdx].q;
      startTimer();
    }
  };

  function startTimer() {
    let timeLeft = 100;
    const bar = document.getElementById('timerBar');
    const itv = setInterval(() => {
      timeLeft -= 1;
      bar.style.width = timeLeft + "%";
      if(timeLeft <= 0) {
        clearInterval(itv);
        // عند انتهاء الوقت، أظهر المتصدرين عند الجميع
        update(ref(db, `rooms/${roomID}/state`), { status: "timeout", showLeaderboard: true });
      }
    }, 150);
  }

  // تحديث لوحة الصدارة ومراقبة اللاعبين للسرقة
  onValue(ref(db, `rooms/${roomID}/players`), (snap) => {
    playersData = snap.val() || {};
    const sorted = Object.entries(playersData).sort((a,b) => b[1].score - a[1].score);
    
    // عرض المتصدرين في الهوست
    document.getElementById('lbItems').innerHTML = sorted.map(([id, p]) => `
      <div style="display:flex; justify-content:space-between; padding:5px; border-bottom:1px solid #333;">
        <span>${p.name}</span><b>${p.score}</b>
      </div>
    `).join('');

    // تحديث قائمة السرقة
    document.getElementById('playerStealList').innerHTML = sorted.map(([id, p]) => `
      <div class="player-list-item">
        <span>${p.name} (${p.score} نقطة)</span>
        <button class="btn-steal" style="padding:5px 15px;" onclick="executeSteal('${id}', '${p.name}')">اسرق 1500 منه 💸</button>
      </div>
    `).join('');
  });

  window.openStealPanel = function() {
    document.getElementById('stealPanel').style.display = 'block';
  };

  window.executeSteal = function(pID, pName) {
    update(ref(db, `rooms/${roomID}/players/${pID}`), { score: increment(-1500) });
    set(ref(db, `rooms/${roomID}/state/lastSteal`), { msg: `🥷 محمد جابر سرق 1500 نقطة من ${pName}!` });
    alert(`تمت السرقة من ${pName} بنجاح!`);
  };
</script>
</body>
</html>
