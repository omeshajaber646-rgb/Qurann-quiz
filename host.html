<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة المضيف - الموعظة من القرآن</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a1628;--card:#0f2040;--accent:#c9a84c;--accent2:#e8c96e;--green:#2ecc71;--red:#e74c3c;--blue:#3498db;--text:#f0e8d0;--border:rgba(201,168,76,0.3);}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 10%,rgba(201,168,76,0.08) 0%,transparent 50%),radial-gradient(ellipse at 80% 90%,rgba(52,152,219,0.06) 0%,transparent 50%);pointer-events:none;z-index:0;}
.wrap{max-width:900px;margin:0 auto;position:relative;z-index:1;}
.header{text-align:center;margin-bottom:24px;}
.header h1{font-size:1.8rem;font-weight:900;color:var(--accent2);text-shadow:0 0 20px rgba(201,168,76,0.4);}
.header p{color:#8899aa;font-size:0.85rem;margin-top:4px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px;margin-bottom:16px;}
.card-title{font-size:1rem;font-weight:700;color:var(--accent);margin-bottom:16px;}
.room-code-box{background:rgba(201,168,76,0.1);border:2px solid var(--accent);border-radius:14px;padding:18px;text-align:center;margin-bottom:16px;}
.room-label{font-size:0.8rem;color:#8899aa;margin-bottom:6px;}
.room-code{font-size:3rem;font-weight:900;color:var(--accent2);letter-spacing:8px;text-shadow:0 0 30px rgba(201,168,76,0.5);}
.room-link{font-size:0.72rem;color:#6699aa;margin-top:6px;word-break:break-all;}
.players-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;min-height:60px;}
.player-chip{background:rgba(52,152,219,0.15);border:1px solid rgba(52,152,219,0.3);border-radius:8px;padding:8px;text-align:center;font-size:0.85rem;font-weight:600;color:#7dc7f0;}
.player-chip.answered{background:rgba(46,204,113,0.15);border-color:rgba(46,204,113,0.4);color:#7de8a0;}
.no-players{color:#556677;font-size:0.85rem;text-align:center;padding:16px;grid-column:1/-1;}
.btn{border:none;border-radius:10px;padding:13px 24px;font-family:'Cairo',sans-serif;font-weight:700;font-size:0.95rem;cursor:pointer;transition:all 0.25s;width:100%;}
.btn-gold{background:linear-gradient(135deg,#c9a84c,#e8c96e);color:#0a1628;}
.btn-gold:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 20px rgba(201,168,76,0.4);}
.btn-gold:disabled{opacity:0.4;cursor:not-allowed;}
.btn-green{background:linear-gradient(135deg,#27ae60,#1e8449);color:white;}
.btn-green:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(39,174,96,0.4);}
.btn-gray{background:rgba(255,255,255,0.08);color:#aaa;margin-top:8px;}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.stat-box{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:12px;text-align:center;}
.stat-num{font-size:1.6rem;font-weight:900;color:var(--accent2);}
.stat-label{font-size:0.72rem;color:#8899aa;margin-top:2px;}
.timer-wrap{text-align:center;margin-bottom:14px;}
.timer-big{font-size:3.5rem;font-weight:900;color:var(--accent2);line-height:1;}
.timer-bar{height:6px;background:rgba(255,255,255,0.1);border-radius:50px;overflow:hidden;margin-top:8px;}
.timer-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width 1s linear;}
.q-box{background:rgba(201,168,76,0.06);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:12px;text-align:center;}
.q-cat{display:inline-block;background:rgba(201,168,76,0.15);border:1px solid var(--border);border-radius:16px;padding:3px 12px;font-size:0.75rem;color:var(--accent);margin-bottom:8px;}
.q-num{font-size:0.75rem;color:#8899aa;margin-bottom:6px;}
.q-text{font-size:1.2rem;font-weight:700;line-height:1.8;}
.answers-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.ans-p{border-radius:8px;padding:10px 12px;font-size:0.85rem;font-weight:600;display:flex;align-items:center;gap:6px;}
.ans-p.a0{background:rgba(231,76,60,0.2);border:1px solid rgba(231,76,60,0.4);color:#f08080;}
.ans-p.a1{background:rgba(52,152,219,0.2);border:1px solid rgba(52,152,219,0.4);color:#80c8f0;}
.ans-p.a2{background:rgba(243,156,18,0.2);border:1px solid rgba(243,156,18,0.4);color:#f0c878;}
.ans-p.a3{background:rgba(39,174,96,0.2);border:1px solid rgba(39,174,96,0.3);color:#80e0a0;}
.ans-p.correct-ans{outline:3px solid var(--green);outline-offset:2px;}
.correct-reveal{font-size:1.1rem;font-weight:700;color:var(--green);padding:12px;background:rgba(46,204,113,0.1);border-radius:10px;text-align:center;margin-bottom:12px;}
.lb-item{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.04);border-radius:8px;padding:10px 14px;margin-bottom:6px;}
.lb-rank{font-size:1.1rem;font-weight:900;color:var(--accent);min-width:28px;}
.lb-name{flex:1;font-weight:600;}
.lb-score{font-weight:900;color:var(--accent2);}
.lb-item:nth-child(1){background:rgba(201,168,76,0.15);border:1px solid rgba(201,168,76,0.3);}
.screen{display:none;}.screen.active{display:block;}
.status{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;margin-bottom:12px;font-size:0.85rem;font-weight:600;}
.status.waiting{background:rgba(52,152,219,0.15);border:1px solid rgba(52,152,219,0.3);color:#7dc7f0;}
.status.live{background:rgba(231,76,60,0.15);border:1px solid rgba(231,76,60,0.3);color:#f08080;}
.dot{width:7px;height:7px;border-radius:50%;animation:pulse 1.5s infinite;}
.dot.blue{background:#3498db;}.dot.red{background:#e74c3c;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
@media(max-width:500px){.answers-grid{grid-template-columns:1fr}.room-code{font-size:2.2rem}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>🎓 لوحة المضيف</h1>
    <p>الموعظة من القرآن الكريم — سورة لقمان</p>
  </div>

  <!-- SETUP -->
  <div class="screen active" id="setupScreen">
    <div class="card">
      <div class="card-title">🔑 رمز الغرفة</div>
      <div class="room-code-box">
        <div class="room-label">شارك هذا الرمز مع الطلاب ليدخلوا</div>
        <div class="room-code" id="roomCodeDisplay">- - - - -</div>
        <div class="room-link" id="roomLinkDisplay"></div>
      </div>
      <button class="btn btn-gold" id="btnGenRoom">⚡ إنشاء غرفة جديدة</button>
    </div>
    <div class="card" id="waitingCard" style="display:none">
      <div class="card-title">👥 الطلاب المنضمون (<span id="playerCount">0</span>)</div>
      <div class="status waiting"><div class="dot blue"></div> في انتظار الطلاب...</div>
      <div class="players-grid" id="playersGrid"><div class="no-players">لم ينضم أحد بعد</div></div>
      <div style="margin-top:16px">
        <button class="btn btn-gold" id="btnStart" disabled>▶ ابدأ اللعبة</button>
      </div>
    </div>
  </div>

  <!-- GAME -->
  <div class="screen" id="gameScreen">
    <div class="stats-row">
      <div class="stat-box"><div class="stat-num" id="statQ">1</div><div class="stat-label">السؤال</div></div>
      <div class="stat-box"><div class="stat-num" id="statAns">0</div><div class="stat-label">أجابوا</div></div>
      <div class="stat-box"><div class="stat-num" id="statTotal">0</div><div class="stat-label">اللاعبون</div></div>
    </div>
    <div class="card">
      <div class="timer-wrap">
        <div class="timer-big" id="timerBig">20</div>
        <div style="font-size:0.75rem;color:#8899aa;margin-top:4px;">ثانية</div>
        <div class="timer-bar"><div class="timer-fill" id="timerFill" style="width:100%"></div></div>
      </div>
      <div class="q-box">
        <div class="q-cat" id="qCat"></div>
        <div class="q-num" id="qNum"></div>
        <div class="q-text" id="qText"></div>
      </div>
      <div class="answers-grid" id="ansPrev"></div>
      <div class="status live" id="liveStatus"><div class="dot red"></div> السؤال مباشر الآن</div>
      <div class="players-grid" id="answeredGrid"></div>
    </div>
    <div id="revealCard" style="display:none">
      <div class="card">
        <div class="card-title">✅ الإجابة الصحيحة</div>
        <div class="correct-reveal" id="correctReveal"></div>
        <button class="btn btn-green" id="btnNext">التالي ◄</button>
      </div>
    </div>
  </div>

  <!-- RESULTS -->
  <div class="screen" id="resultsScreen">
    <div class="card">
      <div class="card-title">🏆 النتائج النهائية</div>
      <div id="leaderboard"></div>
      <button class="btn btn-gold" onclick="location.reload()" style="margin-top:16px">🔄 لعبة جديدة</button>
    </div>
  </div>
</div>

<script>
firebase.initializeApp({databaseURL:"https://quran111-quizz-default-rtdb.firebaseio.com"});
const db = firebase.database();
const SHAPES = ["▲","◆","●","■"];

const questions = [
  {category:"تعريف الموعظة",text:"من أين مأخوذة كلمة الموعظة لغةً؟",answers:["من الفعل وَعَظ","من الفعل عَظُمَ","من الفعل وَصَى","من الفعل نَصَحَ"],correct:0},
  {category:"تعريف الموعظة",text:"ما معنى الموعظة اصطلاحاً؟",answers:["تلاوة القرآن فقط","تذكير الإنسان بما ينفعه وتحذيره مما يضره مع الترغيب والترهيب","الأمر بالمعروف فقط","الدعاء والتضرع"],correct:1},
  {category:"الموعظة في القرآن",text:"في أي سورة: ﴿يا أيها الناس قد جاءتكم موعظة من ربكم وشفاء لما في الصدور﴾؟",answers:["سورة البقرة","سورة يونس آية 57","سورة النحل","سورة آل عمران"],correct:1},
  {category:"أنواع الموعظة",text:"الموعظة التي تعرض قصص الأنبياء والأمم السابقة لأخذ العبرة تسمى:",answers:["الموعظة بالحكمة","الموعظة بالقصص","الموعظة بالترغيب","الموعظة بالجدال"],correct:1},
  {category:"أنواع الموعظة",text:"الموعظة بالترغيب والترهيب تعني:",answers:["الوعد بالجنة فقط","التخويف من النار فقط","تحفيز النفس بذكر الجنة وتحذيرها بذكر النار","سرد القصص الدينية"],correct:2},
  {category:"سورة لقمان — وصية 1",text:"ما أول وصية بدأ بها لقمان ابنه؟",answers:["بر الوالدين","الوصية بتوحيد الله والنهي عن الشرك","إقامة الصلاة","حسن الخلق"],correct:1},
  {category:"سورة لقمان — وصية 1",text:"كيف وصف القرآن الشرك في سورة لقمان؟",answers:["ذنب كبير","خطأ فادح","ظلم عظيم","كفر مبين"],correct:2},
  {category:"سورة لقمان — وصية 2",text:"ما الوصية الثانية في سورة لقمان؟",answers:["إقامة الصلاة","حسن الخلق","بر الوالدين","النهي عن الكبر"],correct:2},
  {category:"سورة لقمان — وصية 2",text:"ما الحكمة من بر الوالدين كما في العارضة؟",answers:["لأنهما يملكان المال","اعتراف بالجميل ووفاء للعهد وسلوك طريق الفضل","لأن طاعتهما واجبة في كل شيء","لأن الأم هي الأهم فقط"],correct:1},
  {category:"سورة لقمان — وصية 3",text:"الوصية الثالثة تشمل ثلاثة أمور، ما هي؟",answers:["الصيام والزكاة والحج","إقامة الصلاة والأمر بالمعروف والنهي عن المنكر والصبر","الصلاة والزكاة وبر الوالدين","التوحيد والصلاة والصوم"],correct:1},
  {category:"سورة لقمان — وصية 3",text:"ما الذي وصف بأنه وقود الاستمرار في طريق الحق؟",answers:["العلم والمعرفة","المال والقوة","الصبر على الشدائد","الدعاء والتوكل"],correct:2},
  {category:"سورة لقمان — وصية 4",text:"الوصية الرابعة هي الوصية بحسن الخلق، ما أبرز ما تضمنته؟",answers:["كثرة الصدقة","ترك الكبر والتعالي في التعامل مع الناس","الحرص على العبادة فقط","الابتعاد عن الناس"],correct:1},
  {category:"سورة لقمان — وصية 4",text:"ما الذي يفتح القلوب ويجلب محبة الله حسب وصية لقمان الرابعة؟",answers:["كثرة الكلام","الثروة والمكانة","التواضع وترك الكبر","الصمت الدائم"],correct:2},
  {category:"مقاصد الموعظة",text:"القرآن الكريم ليس مجرد نصيحة عابرة بل هو:",answers:["كتاب تاريخ وقصص","منهج رباني متكامل يهدف إلى إصلاح النفس وتزكيتها","مجموعة أوامر ونواهي فقط","كتاب للعبادة فقط"],correct:1},
  {category:"خلاصة الدرس",text:"موعظة لقمان في السورة تهدف بشكل رئيسي إلى:",answers:["إثبات فضل لقمان","تكوين شخصية مؤمنة متكاملة في علاقتها بالله والناس والنفس","حفظ الآيات فقط","الترهيب من العقوبة فقط"],correct:1}
];

let roomCode=null,roomRef=null,currentQ=0,timerInt=null,timeLeft=20,players={},gamePhase='setup';

document.getElementById('btnGenRoom').onclick=()=>{
  roomCode=Math.random().toString(36).substring(2,7).toUpperCase();
  document.getElementById('roomCodeDisplay').textContent=roomCode;
  const base=window.location.href.replace('host.html','index.html');
  document.getElementById('roomLinkDisplay').textContent=base+'?room='+roomCode;
  roomRef=db.ref('rooms/'+roomCode);
  roomRef.set({status:'waiting',currentQ:-1,players:{},createdAt:Date.now()});
  document.getElementById('waitingCard').style.display='block';
  document.getElementById('btnGenRoom').disabled=true;
  roomRef.child('players').on('value',snap=>{
    players=snap.val()||{};
    const c=Object.keys(players).length;
    document.getElementById('playerCount').textContent=c;
    document.getElementById('statTotal').textContent=c;
    renderPlayers();
    document.getElementById('btnStart').disabled=c<1;
  });
};

function renderPlayers(){
  const g=document.getElementById('playersGrid');
  const k=Object.keys(players);
  if(!k.length){g.innerHTML='<div class="no-players">لم ينضم أحد بعد</div>';return;}
  g.innerHTML=k.map(id=>`<div class="player-chip">${players[id].name}</div>`).join('');
}

document.getElementById('btnStart').onclick=()=>{
  document.getElementById('setupScreen').classList.remove('active');
  document.getElementById('gameScreen').classList.add('active');
  showQuestion();
};

function showQuestion(){
  gamePhase='question';
  const q=questions[currentQ];
  document.getElementById('revealCard').style.display='none';
  document.getElementById('liveStatus').style.display='flex';
  document.getElementById('statQ').textContent=`${currentQ+1}/${questions.length}`;
  document.getElementById('statAns').textContent='0';
  document.getElementById('qCat').textContent=q.category;
  document.getElementById('qNum').textContent=`السؤال ${currentQ+1} من ${questions.length}`;
  document.getElementById('qText').textContent=q.text;
  document.getElementById('ansPrev').innerHTML=q.answers.map((a,i)=>
    `<div class="ans-p a${i}${i===q.correct?' correct-ans':''}"><span>${SHAPES[i]}</span>${a}</div>`).join('');
  document.getElementById('answeredGrid').innerHTML='';
  roomRef.update({status:'question',currentQ,questionData:{text:q.text,category:q.category,answers:q.answers,timeLimit:20},answers:null});
  roomRef.child('answers').on('value',snap=>{
    if(gamePhase!=='question')return;
    const ans=snap.val()||{};
    document.getElementById('statAns').textContent=Object.keys(ans).length;
    const g=document.getElementById('answeredGrid');
    g.innerHTML=Object.keys(players).map(k=>{
      const done=ans&&ans[k];
      return`<div class="player-chip${done?' answered':''}">${players[k].name}${done?' ✓':''}</div>`;
    }).join('');
  });
  startTimer();
}

function startTimer(){
  timeLeft=20;clearInterval(timerInt);updateTimer();
  timerInt=setInterval(()=>{timeLeft--;updateTimer();if(timeLeft<=0){clearInterval(timerInt);revealAnswer();}},1000);
}
function updateTimer(){
  const t=document.getElementById('timerBig');
  t.textContent=timeLeft;
  t.style.color=timeLeft>10?'#e8c96e':timeLeft>5?'#ff9b35':'#e74c3c';
  document.getElementById('timerFill').style.width=(timeLeft/20*100)+'%';
}
function revealAnswer(){
  gamePhase='reveal';clearInterval(timerInt);
  roomRef.child('answers').off();
  roomRef.update({status:'reveal',correctAnswer:questions[currentQ].correct});
  document.getElementById('liveStatus').style.display='none';
  document.getElementById('revealCard').style.display='block';
  const q=questions[currentQ];
  document.getElementById('correctReveal').textContent=`${SHAPES[q.correct]}  ${q.answers[q.correct]}`;
}
document.getElementById('btnNext').onclick=()=>{
  currentQ++;
  if(currentQ>=questions.length)showResults();
  else showQuestion();
};
function showResults(){
  gamePhase='results';
  roomRef.update({status:'finished'});
  document.getElementById('gameScreen').classList.remove('active');
  document.getElementById('resultsScreen').classList.add('active');
  roomRef.child('scores').once('value',snap=>{
    const sc=snap.val()||{};
    const sorted=Object.keys(players).map(k=>({name:players[k].name,score:sc[k]||0})).sort((a,b)=>b.score-a.score);
    const medals=['🥇','🥈','🥉'];
    document.getElementById('leaderboard').innerHTML=sorted.map((p,i)=>`
      <div class="lb-item">
        <div class="lb-rank">${medals[i]||(i+1)}</div>
        <div class="lb-name">${p.name}</div>
        <div class="lb-score">${p.score} نقطة</div>
      </div>`).join('');
  });
}
</script>
</body>
</html>
