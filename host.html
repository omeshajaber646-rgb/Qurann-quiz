<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>👑 أوميجا - منصة الإدارة (محمد وبهاء)</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --gold: #d4af37; --navy: #0a192f; --wine: #722f37; }
  body { font-family: 'Tajawal', sans-serif; background: var(--navy); color: #fff; margin: 0; display: flex; height: 100vh; overflow: hidden; }
  
  .sidebar { width: 350px; background: rgba(0,0,0,0.4); border-left: 2px solid var(--gold); padding: 20px; overflow-y: auto; box-shadow: 5px 0 15px rgba(0,0,0,0.5); }
  .main-content { flex: 1; padding: 30px; overflow-y: auto; }
  
  .card { background: rgba(255,255,255,0.05); border: 1px solid var(--gold); border-radius: 15px; padding: 20px; margin-bottom: 20px; }
  .btn { padding: 12px 20px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; font-family: 'Tajawal'; }
  .btn-gold { background: var(--gold); color: var(--navy); width: 100%; margin-top: 10px; font-size: 1.1rem; }
  .btn-danger { background: var(--wine); color: white; padding: 5px 15px; font-size: 0.8rem; }
  
  input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid var(--gold); background: #1a1a2e; color: white; box-sizing: border-box; }
  .q-item { background: rgba(255,255,255,0.03); border-radius: 10px; padding: 15px; margin-bottom: 10px; border-right: 4px solid var(--gold); }
  .code-display { font-size: 4rem; color: var(--gold); font-weight: 900; text-shadow: 0 0 20px rgba(212,175,55,0.3); }
  .live-log { background: #000; color: #0f0; padding: 15px; font-family: monospace; height: 150px; overflow-y: auto; border-radius: 10px; border: 1px solid #333; line-height: 1.5; }
</style>
</head>
<body>

<div class="sidebar">
  <h2 style="color:var(--gold); text-align:center;">🛠 بنك الأسئلة الدائم</h2>
  <div class="card">
    <p style="font-size: 0.9rem; opacity: 0.8;">إضافة سؤال جديد (يُحفظ عند الجميع):</p>
    <input type="text" id="newQ" placeholder="نص السؤال...">
    <input type="text" id="opt0" placeholder="الإجابة الصحيحة ✅">
    <input type="text" id="opt1" placeholder="خيار خطأ 1">
    <input type="text" id="opt2" placeholder="خيار خطأ 2">
    <input type="text" id="opt3" placeholder="خيار خطأ 3">
    <button class="btn btn-gold" onclick="saveQuestionToDB()">💾 حفظ السؤال في السحاب</button>
  </div>
  <div id="questionsList">
    <p style="text-align:center; opacity:0.5;">جاري تحميل الأسئلة...</p>
  </div>
</div>

<div class="main-content">
  <div class="card" id="setupZone">
    <h1 style="font-size: 2.5rem;">لوحة التحكم المشتركة 👑</h1>
    <p>أهلاً بك يا <span style="color:var(--gold)">محمد</span> ويا <span style="color:var(--gold)">بهاء</span></p>
    <button class="btn btn-gold" style="padding: 25px; font-size: 1.5rem;" onclick="initRoom()">✨ إنشاء غرفة تحدي جديدة</button>
  </div>

  <div id="gameZone" style="display:none">
    <div style="display:grid; grid-template-columns: 1fr 1.5fr; gap: 20px;">
      <div class="card">
        <h3>كود الغرفة:</h3>
        <div class="code-display" id="roomOut">----</div>
        <hr style="border:0; border-top:1px solid #333; margin:20px 0;">
        <p id="pCount" style="font-size:1.2rem;">اللاعبون: 0</p>
        <button class="btn btn-gold" onclick="startGame()" id="startBtn">🚀 ابدأ التحدي</button>
        <button class="btn btn-gold" onclick="nextQuestion()" id="nextBtn" style="display:none; background:#2ecc71; color:white;">السؤال التالي ⏭️</button>
      </div>
      
      <div class="card">
        <h3 style="color:var(--gold)">🏆 المتصدرون الآن</h3>
        <div id="leaderboard" style="font-size: 1.3rem;"></div>
      </div>
    </div>

    <div class="card">
      <h2 id="currentQText">في انتظار انطلاق السؤال الأول..</h2>
      <div class="live-log" id="logs">📟 نظام أوميجا جاهز للعمل...</div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
  import { getDatabase, ref, set, onValue, update, push, remove } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDxbPH1pEScwMuRlnUqvKatCfit6xq-MfY",
    authDomain: "qurnn-1c9c4.firebaseapp.com",
    databaseURL: "https://qurnn-1c9c4-default-rtdb.firebaseio.com",
    projectId: "qurnn-1c9c4",
    storageBucket: "qurnn-1c9c4.firebasestorage.app",
    messagingSenderId: "483393093513",
    appId: "1:483393093513:web:ae3ff0f67e6945a91b6b58"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  
  let currentRoom = "";
  let questionsData = [];
  let currentQIdx = -1;

  // 1. جلب الأسئلة من الداتابيز وحفظها محلياً عند أي تغيير
  onValue(ref(db, 'admin/questions'), (snapshot) => {
    const data = snapshot.val();
    questionsData = data ? Object.entries(data) : []; 
    renderQuestions();
  });

  window.saveQuestionToDB = function() {
    const q = document.getElementById('newQ').value;
    const opts = [
      document.getElementById('opt0').value,
      document.getElementById('opt1').value,
      document.getElementById('opt2').value,
      document.getElementById('opt3').value
    ];

    if(!q || !opts[0]) return alert("يرجى ملء السؤال والإجابة الصحيحة!");

    const qRef = push(ref(db, 'admin/questions'));
    set(qRef, { q, opts, ans: 0 }).then(() => {
      document.querySelectorAll('.sidebar input').forEach(i => i.value = "");
    });
  };

  window.deleteQ = function(id) {
    if(confirm("حذف السؤال نهائياً؟")) {
      remove(ref(db, `admin/questions/${id}`));
    }
  };

  function renderQuestions() {
    const list = document.getElementById('questionsList');
    if(questionsData.length === 0) {
        list.innerHTML = "<p style='text-align:center; opacity:0.5;'>لا توجد أسئلة مخزنة.</p>";
        return;
    }
    list.innerHTML = questionsData.map(([id, data]) => `
      <div class="q-item">
        <strong>${data.q}</strong><br>
        <span style="font-size:0.8rem; color:#2ecc71">✅ ${data.opts[0]}</span>
        <div style="text-align:left; margin-top:5px;">
            <button class="btn-danger" onclick="deleteQ('${id}')">حذف</button>
        </div>
      </div>
    `).join('');
  }

  // 2. إدارة الغرفة واللعب
  window.initRoom = function() {
    currentRoom = Math.floor(1000 + Math.random() * 9000).toString();
    set(ref(db, `rooms/${currentRoom}/state`), { status: "waiting", index: -1 });
    
    document.getElementById('setupZone').style.display = 'none';
    document.getElementById('gameZone').style.display = 'block';
    document.getElementById('roomOut').innerText = currentRoom;

    // مراقبة اللاعبين
    onValue(ref(db, `rooms/${currentRoom}/players`), (s) => {
      const players = s.val() || {};
      const sorted = Object.values(players).sort((a,b) => b.score - a.score);
      document.getElementById('pCount').innerText = `اللاعبون المتصلون: ${Object.keys(players).length}`;
      document.getElementById('leaderboard').innerHTML = sorted.map((p, i) => `
        <div style="display:flex; justify-content:space-between; margin-bottom:10px; border-bottom:1px solid #333;">
          <span>${i+1}. ${p.name}</span><b>${p.score}</b>
        </div>
      `).join('');
    });
  };

  window.startGame = function() {
    if(questionsData.length === 0) return alert("البنك فارغ! أضف أسئلة أولاً.");
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('nextBtn').style.display = 'inline-block';
    nextQuestion();
  };

  window.nextQuestion = function() {
    currentQIdx++;
    if(currentQIdx < questionsData.length) {
      const q = questionsData[currentQIdx][1];
      update(ref(db, `rooms/${currentRoom}/state`), {
        status: "playing",
        index: currentQIdx,
        qText: q.q,
        options: q.opts
      });
      document.getElementById('currentQText').innerText = `سؤال ${currentQIdx+1}: ${q.q}`;
      logEvent(`تم إطلاق السؤال: ${q.q}`);
    } else {
      document.getElementById('currentQText').innerText = "🏁 انتهى التحدي!";
      update(ref(db, `rooms/${currentRoom}/state`), { status: "ended" });
    }
  };

  function logEvent(msg) {
    const logBox = document.getElementById('logs');
    logBox.innerHTML += `<div>> [${new Date().toLocaleTimeString()}] ${msg}</div>`;
    logBox.scrollTop = logBox.scrollHeight;
  }
</script>
</body>
</html>
