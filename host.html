<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👑 لوحة تحكم أوميجا - محمد جابر</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --gold: #d4af37; --navy: #0a192f; --wine: #722f37; --cream: #f3e5ab; }
  body { font-family: 'Tajawal', sans-serif; background: var(--navy); color: #fff; margin: 0; text-align: center; }
  .container { max-width: 900px; margin: auto; padding: 20px; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
  
  /* شاشة البداية */
  .setup-screen { background: rgba(255,255,255,0.05); padding: 50px; border-radius: 30px; border: 2px solid var(--gold); box-shadow: 0 0 50px rgba(0,0,0,0.5); }
  
  /* لوحة الغرفة */
  .room-info { display:none; background: rgba(212,175,55,0.1); padding: 25px; border-radius: 20px; border: 2px solid var(--gold); margin-bottom: 20px; }
  .code-display { font-size: 4rem; font-weight: 900; color: var(--gold); letter-spacing: 10px; margin: 10px 0; }
  
  .btn { padding: 20px 40px; border-radius: 50px; border: none; font-weight: 900; cursor: pointer; font-size: 1.3rem; transition: 0.3s; margin: 10px; }
  .btn-create { background: var(--gold); color: var(--navy); box-shadow: 0 0 20px rgba(212,175,55,0.4); }
  .btn-start { background: #2ecc71; color: white; display: none; }
  .btn-next { background: var(--gold); color: var(--navy); display: none; }
  .btn-steal { background: var(--wine); color: white; }

  #leaderboard { display:none; margin-top: 30px; background: rgba(0,0,0,0.4); padding: 20px; border-radius: 20px; border: 1px solid var(--gold); }
  .lb-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid rgba(212,175,55,0.2); }
</style>
</head>
<body>

<div class="container">
  <div id="setupScreen" class="setup-screen">
    <h1 style="color: var(--gold); font-size: 3.5rem; margin-bottom: 30px;">OMEGA CONTROL</h1>
    <button class="btn btn-create" onclick="createNewRoom()">✨ إنشاء غرفة جديدة للطلاب</button>
  </div>

  <div id="gamePanel" style="display:none">
    <div class="room-info" id="roomBox" style="display:block">
      <h2 style="margin:0">أعطِ هذا الكود للطلاب للدخول:</h2>
      <div class="code-display" id="roomCodeDisplay">----</div>
      <p id="playerCount">اللاعبون المتصلون: 0</p>
    </div>

    <div id="questionArea" style="background: rgba(255,255,255,0.03); padding: 30px; border-radius: 20px; margin-top: 20px; border: 1px solid rgba(212,175,55,0.3);">
      <h2 id="qText">انتظر دخول جميع الطلاب ثم ابدأ..</h2>
      <div id="timerBarContainer" style="height:8px; background:#111; border-radius:10px; margin-top:20px; overflow:hidden; display:none;">
        <div id="timerBar" style="height:100%; background:var(--gold); width:100%;"></div>
      </div>
    </div>

    <div class="controls">
      <button id="startBtn" class="btn btn-start" onclick="startGame()">🚀 ابدأ اللعبة الآن</button>
      <button id="nextBtn" class="btn btn-next" onclick="nextQuestion()">السؤال التالي ⏭️</button>
      <button class="btn btn-steal" onclick="openSteal()">قائمة السرقة 🥷</button>
    </div>

    <div id="leaderboard">
      <h3 style="color: var(--gold); border-bottom: 2px solid var(--gold); padding-bottom: 10px;">المتصدرون (تظهر للطلاب) 🏆</h3>
      <div id="lbItems"></div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
  import { getDatabase, ref, set, onValue, update, remove, increment } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDxbPH1pEScwMuRlnUqvKatCfit6xq-MfY",
    authDomain: "qurnn-1c9c4.firebaseapp.com",
    databaseURL: "https://qurnn-1c9c4-default-rtdb.firebaseio.com",
    projectId: "qurnn-1c9c4",
    storageBucket: "qurnn-1c9c4.firebasestorage.app",
    messagingSenderId: "483393093513",
    appId: "1:483393093513:web:ae3ff0f67e6945a91b6b58"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  let currentRoom = null;
  let currentQ = -1;

  const questions = [
    { q: "ما معنى كلمة «الموعظة» لغةً؟", opts: ["النصح والتذكير", "الأمر بالمعروف", "القراءة", "الصلاة"], ans: 0 },
    { q: "في أي سورة وردت آية (شفاء لما في الصدور)؟", opts: ["البقرة", "يونس", "لقمان", "يوسف"], ans: 1 }
  ];

  // وظيفة إنشاء الغرفة عند الكبس على الزر
  window.createNewRoom = async function() {
    currentRoom = Math.floor(1000 + Math.random() * 9000).toString();
    
    // تصفير أي بيانات قديمة لهذه الغرفة إن وجدت
    await remove(ref(db, `rooms/${currentRoom}`));

    await set(ref(db, `rooms/${currentRoom}/state`), {
      status: "waiting",
      showLeaderboard: false,
      index: -1
    });

    // تحديث الواجهة
    document.getElementById('setupScreen').style.display = 'none';
    document.getElementById('gamePanel').style.display = 'block';
    document.getElementById('roomCodeDisplay').innerText = currentRoom;
    document.getElementById('startBtn').style.display = 'inline-block';
    
    listenToPlayers();
  };

  function listenToPlayers() {
    onValue(ref(db, `rooms/${currentRoom}/players`), (s) => {
      const players = s.val() || {};
      const list = Object.values(players);
      document.getElementById('playerCount').innerText = `اللاعبون المتصلون: ${list.length}`;
      
      const sorted = list.sort((a,b) => b.score - a.score);
      document.getElementById('lbItems').innerHTML = sorted.map(p => `
        <div class="lb-item"><span>${p.name}</span><b>${p.score}</b></div>
      `).join('');
      if(list.length > 0) document.getElementById('leaderboard').style.display = 'block';
    });
  }

  window.startGame = function() {
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('nextBtn').style.display = 'inline-block';
    nextQuestion();
  };

  window.nextQuestion = function() {
    currentQ++;
    if(currentQ < questions.length) {
      update(ref(db, `rooms/${currentRoom}/state`), {
        status: "playing",
        index: currentQ,
        showLeaderboard: false
      });
      document.getElementById('qText').innerText = questions[currentQ].q;
      startTimer();
    } else {
      document.getElementById('qText').innerText = "انتهت الأسئلة! 🏁";
      update(ref(db, `rooms/${currentRoom}/state`), { status: "ended", showLeaderboard: true });
    }
  };

  function startTimer() {
    document.getElementById('timerBarContainer').style.display = 'block';
    let w = 100;
    const bar = document.getElementById('timerBar');
    const itv = setInterval(() => {
      w -= 2;
      bar.style.width = w + "%";
      if(w <= 0) {
        clearInterval(itv);
        update(ref(db, `rooms/${currentRoom}/state`), { showLeaderboard: true });
      }
    }, 200);
  }

  // نظام السرقة اليدوي
  window.openSteal = function() {
    const victim = prompt("أدخل اسم اللاعب الذي تريد سرقته:");
    if(victim) {
       // سيظهر تنبيه عند الجميع بالسرقة
       update(ref(db, `rooms/${currentRoom}/state`), { 
         lastSteal: { msg: `🥷 محمد جابر سرق نقاط من ${victim}!` } 
       });
       alert("تم إرسال إشعار السرقة للجميع!");
    }
  };
</script>
</body>
</html>
