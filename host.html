<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>👑 أوميجا - بنك الأسئلة العام</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --navy: #0a192f; --wine: #c0392b; }
        body { font-family: 'Tajawal', sans-serif; background: var(--navy); color: #fff; margin: 0; display: flex; height: 100vh; }
        .sidebar { width: 380px; background: rgba(0,0,0,0.6); border-left: 3px solid var(--gold); padding: 25px; overflow-y: auto; }
        .main { flex: 1; padding: 40px; text-align: center; overflow-y: auto; }
        .card { background: rgba(255,255,255,0.07); border: 1px solid var(--gold); border-radius: 20px; padding: 20px; margin-bottom: 20px; backdrop-filter: blur(10px); }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid var(--gold); background: #050b18; color: #fff; }
        .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; cursor: pointer; background: var(--gold); color: var(--navy); font-weight: 900; font-size: 1.1rem; }
        .q-item { background: rgba(255,255,255,0.05); padding: 15px; margin-bottom: 15px; border-radius: 12px; border-right: 6px solid var(--gold); text-align: right; }
        .del-btn { background: var(--wine); color: white; border: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; float: left; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2 style="color:var(--gold); text-align:center;">🌐 بنك الأسئلة الموحد</h2>
    <div class="card">
        <p style="font-size:0.8rem; opacity:0.7">إضافة سؤال (سيظهر عند الجميع فوراً):</p>
        <input type="text" id="q" placeholder="نص السؤال...">
        <input type="text" id="o0" placeholder="الجواب الصحيح ✅">
        <input type="text" id="o1" placeholder="خيار خطأ 1">
        <input type="text" id="o2" placeholder="خيار خطأ 2">
        <input type="text" id="o3" placeholder="خيار خطأ 3">
        <button class="btn" onclick="saveToCloud()">💾 حفظ في بنك أوميجا</button>
    </div>
    <div id="list">جاري تحميل الأسئلة من السحاب...</div>
</div>

<div class="main">
    <div class="card">
        <h1>منصة أوميجا للإدارة المشتركة 👑</h1>
        <p id="netStatus" style="color:orange">فحص الاتصال بالمنصة...</p>
        <hr style="border:0; border-top:1px solid #333; margin:20px 0;">
        <button class="btn" style="background:#27ae60; color:white; width:auto; padding:20px 40px;" onclick="generateRoom()">✨ إنشاء غرفة تحدي جديدة</button>
        <div id="roomBox" style="display:none; margin-top:30px;">
            <h2 style="font-size:4rem; color:var(--gold); margin:0;" id="roomCode">----</h2>
            <p>أعطِ هذا الكود للطلاب للدخول</p>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, push, remove } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-database.js";

    const config = {
        apiKey: "AIzaSyDxbPH1pEScwMuRlnUqvKatCfit6xq-MfY",
        authDomain: "qurnn-1c9c4.firebaseapp.com",
        databaseURL: "https://qurnn-1c9c4-default-rtdb.firebaseio.com",
        projectId: "qurnn-1c9c4",
        storageBucket: "qurnn-1c9c4.firebasestorage.app",
        messagingSenderId: "483393093513",
        appId: "1:483393093513:web:ae3ff0f67e6945a91b6b58"
    };

    const app = initializeApp(config);
    const db = getDatabase(app);

    // 1. فحص الاتصال بالمنصة
    onValue(ref(db, '.info/connected'), (s) => {
        const ns = document.getElementById('netStatus');
        if(s.val() === true) { ns.innerText = "متصل بالبنك العام ✅"; ns.style.color = "#2ecc71"; }
        else { ns.innerText = "فصل الاتصال ❌"; ns.style.color = "#e74c3c"; }
    });

    // 2. مزامنة الأسئلة (أي شخص يفتح الهوست يشوفها)
    onValue(ref(db, 'omega_public_bank'), (snap) => {
        const listDiv = document.getElementById('list');
        const data = snap.val();
        listDiv.innerHTML = "";
        
        if(!data) {
            listDiv.innerHTML = "<p style='text-align:center; opacity:0.5;'>البنك فارغ، كن أول من يضيف سؤالاً!</p>";
            return;
        }

        Object.entries(data).forEach(([id, q]) => {
            listDiv.innerHTML += `
                <div class="q-item">
                    <strong>${q.text}</strong><br>
                    <small style="color:#2ecc71">✅ ${q.options[0]}</small>
                    <button class="del-btn" onclick="deleteQ('${id}')">حذف</button>
                    <div style="clear:both"></div>
                </div>`;
        });
    });

    // 3. الحفظ في السحاب (ببين عند الكل)
    window.saveToCloud = function() {
        const txt = document.getElementById('q').value;
        const o0 = document.getElementById('o0').value;
        if(!txt || !o0) return alert("البيانات ناقصة يا محمد!");

        const newRef = push(ref(db, 'omega_public_bank'));
        set(newRef, {
            text: txt,
            options: [o0, document.getElementById('o1').value, document.getElementById('o2').value, document.getElementById('o3').value]
        }).then(() => {
            document.querySelectorAll('input').forEach(i => i.value = "");
        });
    };

    // 4. الحذف من السحاب (بينحذف عند الكل)
    window.deleteQ = function(id) {
        if(confirm("هل تريد مسح هذا السؤال من البنك العام؟")) {
            remove(ref(db, `omega_public_bank/${id}`));
        }
    };

    window.generateRoom = function() {
        const code = Math.floor(1000 + Math.random() * 9000);
        document.getElementById('roomCode').innerText = code;
        document.getElementById('roomBox').style.display = "block";
    };
</script>
</body>
</html>
