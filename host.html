<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>👑 لوحة تحكم أوميجا - محمد جابر</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --gold: #d4af37; --navy: #0a192f; --cream: #f3e5ab; --wine: #722f37; }
  body { font-family: 'Tajawal', sans-serif; background: var(--navy); color: var(--cream); margin: 0; overflow-x: hidden; }
  
  #liveFeed {
    position: fixed; top: 20px; left: 20px; width: 350px; height: 70px;
    background: rgba(10, 25, 47, 0.95); border: 2px solid var(--gold);
    border-radius: 12px; display: flex; align-items: center; justify-content: center;
    font-weight: bold; color: var(--gold); font-size: 1.1rem; z-index: 1000;
    box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
  }

  .container { max-width: 1100px; margin: 0 auto; padding: 20px; text-align: center; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
  .room-info { font-size: 2rem; color: var(--gold); background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; display: inline-block; margin-bottom: 20px; border: 1px solid var(--gold); }
  
  .q-card { background: rgba(255,255,255,0.03); border: 2px solid var(--gold); border-radius: 24px; padding: 50px; position: relative; box-shadow: 0 10px 50px rgba(0,0,0,0.5); }
  .timer-bar { height: 10px; background: var(--gold); width: 100%; position: absolute; bottom: 0; left: 0; border-radius: 0 0 24px 24px; transition: width 0.2s linear; }
  .question-text { font-size: 3.2rem; font-weight: 900; margin-bottom: 40px; }
  .opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .opt-item { background: rgba(212, 175, 55, 0.08); border: 1px solid var(--gold); padding: 25px; border-radius: 15px; font-size: 1.8rem; color: white; }
  
  .controls { margin-top: 40px; display: flex; justify-content: center; gap: 20px; }
  button { background: var(--gold); color: var(--navy); border: none; padding: 18px 45px; border-radius: 50px; font-weight: 900; cursor: pointer; font-size: 1.3rem; transition: 0.3s; }
  button:hover { transform: scale(1.05); box-shadow: 0 0 30px var(--gold); }

  #leaderboard { position: fixed; right: 20px; top: 20px; width: 260px; background: rgba(0,0,0,0.6); border: 1px solid var(--gold); padding: 20px; border-radius: 20px; }
  .lb-entry { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(212,175,55,0.2); }
</style>
</head>
<body>

<div id="liveFeed">🔔 بانتظار المتنافسين...</div>

<div class="container">
  <h1 style="color: var(--gold); font-size: 3.5rem; margin-bottom: 10px;">OMEGA AIMAN JABIR</h1>
  <div class="room-info">كود الغرفة: <span id="roomDisplay">----</span></div>
  
  <div class="q-card">
    <div class="question-text" id="qText">جاهز للمنافسة؟</div>
    <div class="opt-grid" id="optGrid"></div>
    <div class="timer-bar" id="timerBar"></div>
  </div>

  <div class="controls">
    <button id="startBtn" onclick="startGame()" style="background:#2ecc71">ابدأ اللعبة 🏁</button>
    <button id="nextBtn" onclick="nextQuestion()" style="display:none">السؤال التالي 🚀</button>
    <button onclick="triggerHeist()" style="background:var(--wine); color:white;">تفعيل السرقة 🥷</button>
  </div>

  <div id="leaderboard">
    <h3 style="color: var(--gold); border-bottom: 2px solid var(--gold); padding-bottom: 10px;">المتصدرون 🏆</h3>
    <div id="lbItems"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
  import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    databaseURL: "YOUR_DATABASE_URL",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const roomCode = prompt("أدخل كود الغرفة المخصص للطلاب (مثلاً 2026):") || "2026";
  document.getElementById('roomDisplay').innerText = roomCode;

  let questions = [
    { q: "ما هو تعريف الموعظة لغةً؟", opts: ["النصح والتذكير", "الشدة", "الإهمال", "القراءة"], ans: 0 },
    { q: "سورة ورد فيها (وشفاء لما في الصدور)؟", opts: ["البقرة", "يونس", "لقمان", "يوسف"], ans: 1 }
  ];
  let currentIdx = -1;

  // تصفير الغرفة
  set(ref(db, `rooms/${roomCode}/state`), { status: "waiting", event: "none", index: -1 });

  window.startGame = function() {
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('nextBtn').style.display = 'inline-block';
    nextQuestion();
  };

  window.nextQuestion = function() {
    currentIdx++;
    if(currentIdx < questions.length) {
      const q = questions[currentIdx];
      set(ref(db, `rooms/${roomCode}/state`), {
        status: "playing",
        index: currentIdx,
        event: "none",
        correct: q.ans
      });
      document.getElementById('qText').innerText = q.q;
      document.getElementById('optGrid').innerHTML = q.opts.map(o => `<div class="opt-item">${o}</div>`).join('');
      resetTimer();
    }
  };

  window.triggerHeist = function() {
    update(ref(db, `rooms/${roomCode}/state`), { event: "steal_active" });
    setTimeout(() => update(ref(db, `rooms/${roomCode}/state`), { event: "none" }), 3000);
  };

  onValue(ref(db, `rooms/${roomCode}/logs`), (s) => {
    if(s.exists()) document.getElementById('liveFeed').innerText = s.val().msg;
  });

  onValue(ref(db, `rooms/${roomCode}/players`), (s) => {
    const data = s.val(); if(!data) return;
    const sorted = Object.values(data).sort((a,b) => b.score - a.score);
    document.getElementById('lbItems').innerHTML = sorted.slice(0, 5).map(p => `
      <div class="lb-entry"><span>${p.name}</span><b>${p.score}</b></div>
    `).join('');
  });

  function resetTimer() {
    let w = 100;
    const bar = document.getElementById('timerBar');
    const itv = setInterval(() => {
      w -= 1; bar.style.width = w + "%";
      if(w <= 0) clearInterval(itv);
    }, 200);
  }
</script>
</body>
</html>
