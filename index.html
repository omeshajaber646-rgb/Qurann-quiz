<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 أوميجا كويز - لاعب</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Tajawal', sans-serif; background: #0a0a1a; color: #fff; text-align: center; margin: 0; padding: 20px; }
  .card { background: rgba(255,255,255,0.05); border: 2px solid #d4af37; border-radius: 20px; padding: 30px; max-width: 400px; margin: 50px auto; box-shadow: 0 0 20px rgba(212, 175, 55, 0.2); }
  input { width: 90%; padding: 15px; margin: 10px 0; border-radius: 12px; border: 1px solid #d4af37; background: #1a1a2e; color: #fff; font-size: 1.2rem; text-align: center; }
  .btn { width: 90%; padding: 15px; background: #d4af37; color: #0a192f; border: none; border-radius: 12px; font-weight: 900; cursor: pointer; font-size: 1.2rem; }
  #waitScreen { display: none; }
  #gameUI { display: none; padding: 10px; }
  .opt-btn { width: 100%; padding: 20px; margin: 10px 0; border: none; border-radius: 15px; font-size: 1.5rem; font-weight: bold; color: #fff; cursor: pointer; }
</style>
</head>
<body>

<div id="login" class="card">
  <h2 style="color:#d4af37">دخول التحدي 👑</h2>
  <input id="roomInput" type="number" placeholder="كود الغرفة">
  <input id="nameInput" type="text" placeholder="اسمك الكريم">
  <button class="btn" onclick="joinRoom()">🚀 دخول الآن</button>
  <p id="error" style="color: #ff4757; font-size: 0.8rem; margin-top: 10px;"></p>
</div>

<div id="waitScreen" class="card">
  <h2 style="color:#d4af37">تم الاتصال بنجاح! ✅</h2>
  <p>أهلاً <span id="pName"></span>.. خليك جاهز</p>
  <p style="opacity: 0.7;">بانتظار محمد يبدأ اللعبة... ⏳</p>
</div>

<div id="gameUI">
  <div class="card" style="max-width: 600px;">
    <h2 id="qTitle" style="color:#d4af37">السؤال سيظهر هنا</h2>
    <div id="optionsContainer"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
  import { getDatabase, ref, set, onValue, update, increment } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-database.js";

  // تأكد 100% أن هذه هي بيانات مشروعك الصحيحة
  const firebaseConfig = {
    apiKey: "AIzaSyDxbPH1pEScwMuRlnUqvKatCfit6xq-MfY",
    authDomain: "qurnn-1c9c4.firebaseapp.com",
    databaseURL: "https://qurnn-1c9c4-default-rtdb.firebaseio.com",
    projectId: "qurnn-1c9c4",
    storageBucket: "qurnn-1c9c4.firebasestorage.app",
    messagingSenderId: "483393093513",
    appId: "1:483393093513:web:ae3ff0f67e6945a91b6b58"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  let myID, myRoom;

  window.joinRoom = function() {
    myRoom = document.getElementById('roomInput').value;
    const name = document.getElementById('nameInput').value;
    const err = document.getElementById('error');

    if(!myRoom || !name) { err.innerText = "دخل الكود والاسم يا بطل!"; return; }

    myID = "p_" + Math.random().toString(36).substr(2, 5);

    // تسجيل اللاعب فوراً في قاعدة البيانات
    set(ref(db, `rooms/${myRoom}/players/${myID}`), {
      name: name,
      score: 0
    }).then(() => {
      // إخفاء شاشة الدخول وإظهار الانتظار
      document.getElementById('login').style.display = 'none';
      document.getElementById('waitScreen').style.display = 'block';
      document.getElementById('pName').innerText = name;
      listenToGame();
    }).catch((e) => {
      err.innerText = "مشكلة في السيرفر، جرب مرة ثانية.";
    });
  };

  function listenToGame() {
    onValue(ref(db, `rooms/${myRoom}/state`), (snapshot) => {
      const state = snapshot.val();
      if(state && state.status === "playing") {
        document.getElementById('waitScreen').style.display = 'none';
        document.getElementById('gameUI').style.display = 'block';
        document.getElementById('qTitle').innerText = state.qText;
        
        const container = document.getElementById('optionsContainer');
        container.innerHTML = state.options.map((opt, i) => `
          <button class="opt-btn" style="background:#6366f1" onclick="submitAnswer(${i})">${opt}</button>
        `).join('');
      } else if (state && state.status === "ended") {
        document.getElementById('qTitle').innerText = "🏁 انتهت اللعبة!";
        document.getElementById('optionsContainer').innerHTML = "بانتظار محمد ينهي الجلسة.";
      }
    });
  }

  window.submitAnswer = function(idx) {
    update(ref(db, `rooms/${myRoom}/players/${myID}`), {
      score: increment(1000)
    });
    document.getElementById('optionsContainer').innerHTML = "<h3 style='color:#2ecc71'>تم الإرسال! انتظر السؤال التالي... ✅</h3>";
    // تسجيل الحدث في شريط أحداث الهوست
    set(ref(db, `rooms/${myRoom}/logs`), { msg: `${document.getElementById('pName').innerText} جاوب على السؤال!` });
  };
</script>
</body>
</html>
