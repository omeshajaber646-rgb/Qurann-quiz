<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 أوميجا كويز - دخول اللاعب</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Tajawal', sans-serif; background: #0a0a1a; color: #fff; text-align: center; margin: 0; padding: 20px; }
  .card { background: rgba(255,255,255,0.05); border: 1px solid #6366f1; border-radius: 20px; padding: 30px; max-width: 400px; margin: 50px auto; }
  input { width: 90%; padding: 15px; margin: 10px 0; border-radius: 12px; border: 1px solid #6366f1; background: #1a1a2e; color: #fff; font-size: 1.1rem; text-align: center; }
  .btn { width: 90%; padding: 15px; background: #6366f1; border: none; border-radius: 12px; color: #fff; font-weight: 900; cursor: pointer; font-size: 1.2rem; }
  .status-msg { margin-top: 15px; color: #ff4757; font-size: 0.9rem; }
</style>
</head>
<body>

<div class="card">
  <h2 style="color:#6366f1">انضم للتحدي 👑</h2>
  <input id="codeInput" type="number" placeholder="أدخل كود الغرفة (4 أرقام)">
  <input id="nameInput" type="text" placeholder="أدخل اسمك">
  <button class="btn" onclick="joinGame()">🚀 دخول الآن</button>
  <div id="statusMsg" class="status-msg"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// تأكد أن هذه البيانات تطابق ملف الهوست تماماً
const firebaseConfig = {
  apiKey: "AIzaSyDxbPH1pEScwMuRlnUqvKatCfit6xq-MfY",
  authDomain: "qurnn-1c9c4.firebaseapp.com",
  databaseURL: "https://qurnn-1c9c4-default-rtdb.firebaseio.com",
  projectId: "qurnn-1c9c4",
  storageBucket: "qurnn-1c9c4.firebasestorage.app",
  messagingSenderId: "483393093513",
  appId: "1:483393093513:web:ae3ff0f67e6945a91b6b58"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.joinGame = async function() {
  const code = document.getElementById('codeInput').value;
  const name = document.getElementById('nameInput').value;
  const msg = document.getElementById('statusMsg');

  if(!code || !name) { msg.innerText = "يرجى إدخال الكود والاسم!"; return; }

  // التحقق من وجود الغرفة في Firebase
  const roomRef = ref(db, `rooms/${code}`);
  const snapshot = await get(roomRef);

  if (snapshot.exists()) {
    const playerID = "p_" + Math.random().toString(36).substr(2, 5);
    await set(ref(db, `rooms/${code}/players/${playerID}`), {
      name: name,
      score: 0,
      joinedAt: Date.now()
    });
    
    // حفظ البيانات محلياً والانتقال لصفحة الانتظار أو اللعب
    msg.style.color = "#2ed573";
    msg.innerText = "تم الدخول بنجاح! انتظر الهوست...";
    
    // هنا يمكنك إضافة كود لعرض الأسئلة فور بدئها من الهوست
    onValue(ref(db, `rooms/${code}/state`), (snap) => {
       if(snap.val() && snap.val().status === "playing") {
         alert("بدأت اللعبة! استعد.");
         // يمكنك توجيه اللاعب لواجهة الأسئلة هنا
       }
    });

  } else {
    msg.innerText = "كود الغرفة خاطئ أو لم يتم إنشاؤها بعد!";
  }
};
</script>
</body>
</html>
