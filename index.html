<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>👑 أوميجا - تحدي الأبطال</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --navy: #0a192f; --light: #f1f2f6; }
        body { font-family: 'Tajawal', sans-serif; background: var(--navy); color: #fff; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        .container { width: 90%; max-width: 500px; text-align: center; }
        .card { background: rgba(255,255,255,0.1); border: 2px solid var(--gold); border-radius: 20px; padding: 25px; backdrop-filter: blur(10px); }
        .btn-opt { display: block; width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px; border: 1px solid var(--gold); background: rgba(255,255,255,0.05); color: #fff; cursor: pointer; font-size: 1.1rem; transition: 0.3s; }
        .btn-opt:hover { background: var(--gold); color: var(--navy); }
        
        /* تأثير التجميد */
        .frozen { pointer-events: none; filter: blur(3px) grayscale(1); opacity: 0.6; }
        .frozen-overlay { position: absolute; top:0; left:0; right:0; bottom:0; display:none; align-items:center; justify-content:center; font-size: 5rem; z-index: 100; }

        /* أزرار القوى */
        .powers { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
        .power-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.8rem; }
        .p-freeze { background: #3498db; color: white; }
        .p-shield { background: #2ecc71; color: white; }
        .p-steal { background: #e74c3c; color: white; }
        
        #score-box { position: fixed; top: 10px; right: 10px; background: var(--gold); color: var(--navy); padding: 5px 15px; border-radius: 20px; font-weight: 900; }
    </style>
</head>
<body>

<div id="score-box">النقاط: <span id="myScore">0</span></div>
<div class="frozen-overlay" id="ice">❄️</div>

<div class="container" id="mainGame">
    <div id="loginArea" class="card">
        <h2 style="color:var(--gold)">دخول التحدي 🏆</h2>
        <input type="text" id="pName" placeholder="اسمه البطل..." style="width:80%; padding:10px; margin-bottom:10px; border-radius:8px;">
        <input type="number" id="rCode" placeholder="كود الغرفة" style="width:80%; padding:10px; margin-bottom:20px; border-radius:8px;">
        <button onclick="join()" style="width:87%; padding:15px; background:var(--gold); border:none; border-radius:10px; font-weight:900;">انطلاق!</button>
    </div>

    <div id="gameArea" style="display:none">
        <div class="card">
            <p id="qNum" style="color:var(--gold); font-weight:bold;"></p>
            <h2 id="questionText">في انتظار السؤال...</h2>
            <div id="options"></div>
        </div>

        <div class="powers" id="powerPanel" style="display:none">
            <button class="power-btn p-freeze" onclick="usePower('freeze')">❄️ تجميد</button>
            <button class="power-btn p-shield" onclick="usePower('shield')">🛡️ درع</button>
            <button class="power-btn p-steal" onclick="usePower('steal')">💸 سرقة</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-database.js";

    const config = {
        apiKey: "AIzaSyDxbPH1pEScwMuRlnUqvKatCfit6xq-MfY",
        authDomain: "qurnn-1c9c4.firebaseapp.com",
        databaseURL: "https://qurnn-1c9c4-default-rtdb.firebaseio.com",
        projectId: "qurnn-1c9c4",
        storageBucket: "qurnn-1c9c4.firebasestorage.app",
        messagingSenderId: "483393093513",
        appId: "1:483393093513:web:ae3ff0f67e6945a91b6b58"
    };

    const app = initializeApp(config);
    const db = getDatabase(app);

    let myName = "";
    let room = "";
    let score = 0;
    let hasShield = false;

    window.join = function() {
        myName = document.getElementById('pName').value;
        room = document.getElementById('rCode').value;
        if(!myName || !room) return alert("عبّي بياناتك!");

        document.getElementById('loginArea').style.display = "none";
        document.getElementById('gameArea').style.display = "block";

        // متابعة حالة الغرفة
        onValue(ref(db, `rooms/${room}/state`), (snap) => {
            const state = snap.val();
            if(!state) return;

            if(state.status === "playing") {
                showQuestion(state.qText, state.options, state.qIndex);
                if(state.powersEnabled) document.getElementById('powerPanel').style.display = "flex";
            }
        });

        // متابعة الهجمات (تجميد أو سرقة)
        onValue(ref(db, `rooms/${room}/players/${myName}/effect`), (snap) => {
            const effect = snap.val();
            if(effect === "frozen") {
                document.getElementById('mainGame').classList.add('frozen');
                document.getElementById('ice').style.display = "flex";
                setTimeout(() => {
                    update(ref(db, `rooms/${room}/players/${myName}`), { effect: "none" });
                    document.getElementById('mainGame').classList.remove('frozen');
                    document.getElementById('ice').style.display = "none";
                }, 5000); // تجميد لـ 5 ثواني
            }
        });
    };

    function showQuestion(txt, opts, idx) {
        document.getElementById('qNum').innerText = "سؤال رقم " + (idx + 1);
        document.getElementById('questionText').innerText = txt;
        const optDiv = document.getElementById('options');
        optDiv.innerHTML = "";
        opts.forEach(opt => {
            const b = document.createElement('button');
            b.className = "btn-opt";
            b.innerText = opt;
            b.onclick = () => checkAns(opt, opts[0]); // دايماً أول خيار هو الصح بالكود
            optDiv.appendChild(b);
        });
    }

    function checkAns(picked, correct) {
        if(picked === correct) {
            score += 100;
            document.getElementById('myScore').innerText = score;
            alert("صح! +100");
        } else {
            alert("خطأ! ركز يا بطل");
        }
        document.getElementById('options').innerHTML = "تمت الإجابة.. انتظر السؤال التالي";
    }

    window.usePower = function(type) {
        // هنا يتم إرسال طلب القوة للسيرفر (تحتاج لإكمال منطق اختيار الخصم لاحقاً)
        alert("تم تفعيل " + type + "! (سيتم توجيهها للخصم المتصدر)");
    };
</script>
</body>
</html>
