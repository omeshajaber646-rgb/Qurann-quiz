<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 أوميجا كويز - لاعب</title>
<style>
  body { font-family: sans-serif; background: #0a0a1a; color: white; text-align: center; padding: 20px; }
  .btn { width: 100%; padding: 20px; margin: 10px 0; border: none; border-radius: 10px; font-size: 1.2rem; cursor: pointer; color: white; }
  #gameUI { display: none; }
</style>
</head>
<body>

<div id="login">
  <h2>دخول التحدي 👑</h2>
  <input id="room" type="number" placeholder="كود الغرفة" style="padding:10px; margin:5px;">
  <input id="name" type="text" placeholder="اسمك" style="padding:10px; margin:5px;">
  <button onclick="join()" style="padding:10px 20px; background:#d4af37; border:none; cursor:pointer;">دخول</button>
</div>

<div id="gameUI">
  <h2 id="qTitle">انتظر السؤال...</h2>
  <div id="options"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
  import { getDatabase, ref, set, onValue, update, increment } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-database.js";

  const firebaseConfig = { /* نفس بيانات الهوست */ };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  let myRoom, myID;

  window.join = function() {
    myRoom = document.getElementById('room').value;
    myID = "p_" + Math.random().toString(36).substr(2, 5);
    set(ref(db, `rooms/${myRoom}/players/${myID}`), { name: document.getElementById('name').value, score: 0 });
    
    document.getElementById('login').style.display = 'none';
    document.getElementById('gameUI').style.display = 'block';

    onValue(ref(db, `rooms/${myRoom}/state`), (s) => {
      const state = s.val();
      if(state && state.status === "playing") {
        document.getElementById('qTitle').innerText = state.qText;
        const optsDiv = document.getElementById('options');
        optsDiv.innerHTML = state.options.map((o, i) => `
          <button class="btn" style="background:#6366f1" onclick="answer(${i})">${o}</button>
        `).join('');
      }
    });
  };

  window.answer = function(idx) {
    update(ref(db, `rooms/${myRoom}/players/${myID}`), { score: increment(100) });
    document.getElementById('options').innerHTML = "<h3>تم استلام الإجابة! انتظر السؤال التالي...</h3>";
  };
</script>
</body>
</html>
