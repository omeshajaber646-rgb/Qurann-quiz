<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسابقة الموعظة من القرآن</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1b2a;--card:#112240;--accent:#ffd700;--green:#2ecc71;--red:#e74c3c;--text:#f0e8d0;}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(255,215,0,0.07) 0%,transparent 60%);pointer-events:none;}
.wrap{width:100%;max-width:480px;position:relative;z-index:1;}

/* JOIN */
.join-card{background:var(--card);border:1px solid rgba(255,215,0,0.25);border-radius:20px;padding:32px 24px;text-align:center;}
.join-logo{font-size:3rem;margin-bottom:12px;}
.join-title{font-size:1.6rem;font-weight:900;color:var(--accent);margin-bottom:6px;}
.join-sub{color:#8899aa;font-size:0.85rem;margin-bottom:28px;}
.input-group{margin-bottom:14px;text-align:right;}
.input-group label{display:block;font-size:0.85rem;color:#aaa;margin-bottom:6px;font-weight:600;}
.inp{width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,215,0,0.25);border-radius:10px;padding:13px 16px;font-family:'Cairo',sans-serif;font-size:1rem;color:var(--text);outline:none;direction:rtl;}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,215,0,0.1);}
.inp-code{text-align:center;letter-spacing:6px;font-size:1.3rem;font-weight:900;text-transform:uppercase;}
.btn{width:100%;border:none;border-radius:10px;padding:14px;font-family:'Cairo',sans-serif;font-weight:900;font-size:1rem;cursor:pointer;transition:all 0.25s;}
.btn-gold{background:linear-gradient(135deg,#c9a84c,#ffd700);color:#0d1b2a;}
.btn-gold:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,215,0,0.3);}
.btn-gold:disabled{opacity:0.4;cursor:not-allowed;}
.error-msg{background:rgba(231,76,60,0.15);border:1px solid rgba(231,76,60,0.3);border-radius:8px;padding:10px;color:#f08080;font-size:0.85rem;margin-bottom:12px;display:none;}

/* WAITING */
.wait-card{background:var(--card);border:1px solid rgba(255,215,0,0.2);border-radius:20px;padding:32px 24px;text-align:center;}
.wait-name{font-size:1.4rem;font-weight:900;color:var(--accent);margin-bottom:8px;}
.wait-msg{color:#8899aa;font-size:0.9rem;line-height:1.7;}
.wait-spinner{width:50px;height:50px;border:4px solid rgba(255,215,0,0.15);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:20px auto;}
@keyframes spin{to{transform:rotate(360deg)}}

/* QUESTION */
.q-card{background:var(--card);border:1px solid rgba(255,215,0,0.2);border-radius:20px;padding:20px;}
.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.q-progress{font-size:0.8rem;color:#8899aa;font-weight:600;}
.q-timer{font-size:1.4rem;font-weight:900;color:var(--accent);}
.timer-bar{height:5px;background:rgba(255,255,255,0.08);border-radius:50px;overflow:hidden;margin-bottom:16px;}
.timer-fill{height:100%;background:linear-gradient(90deg,#c9a84c,#ffd700);transition:width 1s linear;}
.q-cat{display:inline-block;background:rgba(255,215,0,0.12);border:1px solid rgba(255,215,0,0.25);border-radius:14px;padding:3px 10px;font-size:0.72rem;color:var(--accent);margin-bottom:8px;}
.q-text{font-size:1.15rem;font-weight:700;line-height:1.8;margin-bottom:18px;text-align:center;}
.ans-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.ans-btn{border:none;border-radius:12px;padding:18px 12px;font-family:'Cairo',sans-serif;font-weight:700;font-size:0.95rem;cursor:pointer;transition:all 0.2s;min-height:70px;display:flex;align-items:center;justify-content:center;gap:6px;line-height:1.4;}
.ans-btn:active:not(:disabled){transform:scale(0.97);}
.ans-btn.a0{background:linear-gradient(135deg,#c0392b,#922b21);color:white;}
.ans-btn.a1{background:linear-gradient(135deg,#1a6fa8,#1258a0);color:white;}
.ans-btn.a2{background:linear-gradient(135deg,#d68910,#b7770d);color:white;}
.ans-btn.a3{background:linear-gradient(135deg,#1e8449,#196f3d);color:white;}
.ans-btn:hover:not(:disabled){filter:brightness(1.15);transform:translateY(-2px);}
.ans-btn.selected-correct{background:linear-gradient(135deg,#27ae60,#1e8449)!important;box-shadow:0 0 20px rgba(46,204,113,0.5);transform:scale(1.03);}
.ans-btn.selected-wrong{background:linear-gradient(135deg,#636363,#444)!important;opacity:0.7;}
.ans-btn.reveal-correct{outline:3px solid var(--green);outline-offset:2px;}
.ans-btn.dimmed{opacity:0.4;}
.ans-shape{font-size:1.1rem;}

/* FEEDBACK */
.feedback-card{background:var(--card);border-radius:20px;padding:32px 24px;text-align:center;}
.fb-icon{font-size:4rem;margin-bottom:12px;}
.fb-title{font-size:1.6rem;font-weight:900;margin-bottom:8px;}
.fb-points{font-size:1.1rem;color:#aaa;}
.fb-correct-ans{margin-top:12px;padding:10px 16px;background:rgba(255,255,255,0.05);border-radius:10px;font-size:0.9rem;color:#ccc;}

/* RESULTS */
.results-card{background:var(--card);border:1px solid rgba(255,215,0,0.25);border-radius:20px;padding:28px 24px;text-align:center;}
.res-title{font-size:1.5rem;font-weight:900;color:var(--accent);margin-bottom:16px;}
.score-circle{width:130px;height:130px;border-radius:50%;background:linear-gradient(135deg,#c9a84c,#ffd700);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 0 40px rgba(255,215,0,0.3);}
.score-num{font-size:2.2rem;font-weight:900;color:#0d1b2a;line-height:1;}
.score-lbl{font-size:0.75rem;color:rgba(13,27,42,0.7);}
.rank-badge{display:inline-block;padding:8px 24px;border-radius:50px;font-weight:700;font-size:1rem;margin-bottom:12px;}
.lb-mini{margin-top:16px;text-align:right;}
.lb-mi-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;margin-bottom:6px;background:rgba(255,255,255,0.04);}
.lb-mi-item:nth-child(1){background:rgba(255,215,0,0.12);border:1px solid rgba(255,215,0,0.25);}
.lb-mi-rank{font-weight:900;color:var(--accent);min-width:24px;}
.lb-mi-name{flex:1;font-size:0.9rem;}
.lb-mi-score{font-weight:900;color:var(--accent);font-size:0.9rem;}

.screen{display:none;}.screen.active{display:block;}
@media(max-width:380px){.ans-grid{grid-template-columns:1fr}.ans-btn{min-height:55px}}
</style>
</head>
<body>
<div class="wrap">

  <!-- JOIN -->
  <div class="screen active" id="joinScreen">
    <div class="join-card">
      <div class="join-logo">📖</div>
      <div class="join-title">مسابقة الموعظة</div>
      <div class="join-sub">من القرآن الكريم — سورة لقمان</div>
      <div class="error-msg" id="errMsg"></div>
      <div class="input-group">
        <label>رمز الغرفة</label>
        <input class="inp inp-code" id="inpCode" placeholder="XXXXX" maxlength="5">
      </div>
      <div class="input-group">
        <label>اسمك</label>
        <input class="inp" id="inpName" placeholder="اكتب اسمك هنا" maxlength="20">
      </div>
      <button class="btn btn-gold" id="btnJoin">انضم للعبة ▶</button>
    </div>
  </div>

  <!-- WAITING -->
  <div class="screen" id="waitScreen">
    <div class="wait-card">
      <div class="join-logo">🌟</div>
      <div class="wait-name" id="waitName"></div>
      <div class="wait-spinner"></div>
      <div class="wait-msg">انضممت بنجاح!<br>في انتظار المضيف ليبدأ اللعبة...</div>
    </div>
  </div>

  <!-- QUESTION -->
  <div class="screen" id="questionScreen">
    <div class="q-card">
      <div class="q-header">
        <div class="q-progress" id="qProg">1/15</div>
        <div class="q-timer" id="qTimer">20</div>
      </div>
      <div class="timer-bar"><div class="timer-fill" id="qTimerFill" style="width:100%"></div></div>
      <div style="text-align:center"><div class="q-cat" id="qCatP"></div></div>
      <div class="q-text" id="qTextP"></div>
      <div class="ans-grid" id="ansGrid"></div>
    </div>
  </div>

  <!-- FEEDBACK -->
  <div class="screen" id="feedbackScreen">
    <div class="feedback-card">
      <div class="fb-icon" id="fbIcon"></div>
      <div class="fb-title" id="fbTitle"></div>
      <div class="fb-points" id="fbPoints"></div>
      <div class="fb-correct-ans" id="fbCorrect"></div>
    </div>
  </div>

  <!-- RESULTS -->
  <div class="screen" id="resultsScreen">
    <div class="results-card">
      <div class="res-title">🏆 انتهت المسابقة!</div>
      <div class="score-circle">
        <div class="score-num" id="myScore">0</div>
        <div class="score-lbl">نقطة</div>
      </div>
      <div class="rank-badge" id="rankBadge"></div>
      <div class="lb-mini" id="lbMini"></div>
    </div>
  </div>

</div>

<script>
firebase.initializeApp({databaseURL:"https://quran111-quizz-default-rtdb.firebaseio.com"});
const db=firebase.database();
const SHAPES=["▲","◆","●","■"];

let myId=null,myName='',roomCode=null,roomRef=null,myScore=0;
let timerInt=null,timeLeft=20,selectedAnswer=null,currentQNum=0,totalQ=15;

// Auto-fill room from URL
const urlParams=new URLSearchParams(window.location.search);
if(urlParams.get('room')) document.getElementById('inpCode').value=urlParams.get('room').toUpperCase();

document.getElementById('btnJoin').onclick=joinRoom;
document.getElementById('inpCode').addEventListener('input',e=>{e.target.value=e.target.value.toUpperCase();});
document.getElementById('inpName').addEventListener('keydown',e=>{if(e.key==='Enter')joinRoom();});

function showErr(msg){const e=document.getElementById('errMsg');e.textContent=msg;e.style.display='block';}
function hideErr(){document.getElementById('errMsg').style.display='none';}

function joinRoom(){
  const code=document.getElementById('inpCode').value.trim().toUpperCase();
  const name=document.getElementById('inpName').value.trim();
  if(!code||code.length<5){showErr('أدخل رمز الغرفة كاملاً');return;}
  if(!name){showErr('أدخل اسمك');return;}
  hideErr();
  document.getElementById('btnJoin').disabled=true;

  db.ref('rooms/'+code).once('value',snap=>{
    if(!snap.exists()){showErr('رمز الغرفة غير صحيح');document.getElementById('btnJoin').disabled=false;return;}
    const room=snap.val();
    if(room.status!=='waiting'){showErr('اللعبة بدأت بالفعل');document.getElementById('btnJoin').disabled=false;return;}
    
    roomCode=code;myName=name;
    myId='p_'+Date.now()+'_'+Math.random().toString(36).substring(2,5);
    roomRef=db.ref('rooms/'+code);
    
    roomRef.child('players/'+myId).set({name,score:0,joinedAt:Date.now()});
    document.getElementById('waitName').textContent='أهلاً '+name+' 👋';
    document.getElementById('joinScreen').classList.remove('active');
    document.getElementById('waitScreen').classList.add('active');
    
    listenToRoom();
  });
}

function listenToRoom(){
  roomRef.child('status').on('value',snap=>{
    const s=snap.val();
    if(s==='question') loadQuestion();
    else if(s==='reveal') showReveal();
    else if(s==='finished') showResults();
  });
}

let lastQ=-1;
function loadQuestion(){
  roomRef.child('questionData').once('value',snap=>{
    const q=snap.val();
    if(!q)return;
    roomRef.child('currentQ').once('value',csnap=>{
      const qNum=csnap.val();
      if(qNum===lastQ)return;
      lastQ=qNum;
      currentQNum=qNum;
      selectedAnswer=null;
      
      document.getElementById('feedbackScreen').classList.remove('active');
      document.getElementById('waitScreen').classList.remove('active');
      document.getElementById('questionScreen').classList.add('active');
      
      document.getElementById('qProg').textContent=`${qNum+1}/${totalQ}`;
      document.getElementById('qCatP').textContent=q.category;
      document.getElementById('qTextP').textContent=q.text;
      
      const grid=document.getElementById('ansGrid');
      grid.innerHTML=q.answers.map((a,i)=>`
        <button class="ans-btn a${i}" onclick="selectAns(${i})" id="ansBtn${i}">
          <span class="ans-shape">${SHAPES[i]}</span>${a}
        </button>`).join('');
      
      startQTimer(q.timeLimit||20);
    });
  });
}

function startQTimer(limit){
  timeLeft=limit;clearInterval(timerInt);updateQTimer();
  timerInt=setInterval(()=>{timeLeft--;updateQTimer();if(timeLeft<=0){clearInterval(timerInt);if(!selectedAnswer&&selectedAnswer!==0)timeOutQ();}},1000);
}
function updateQTimer(){
  const t=document.getElementById('qTimer');
  t.textContent=timeLeft;
  t.style.color=timeLeft>10?'#ffd700':timeLeft>5?'#ff9b35':'#e74c3c';
  document.getElementById('qTimerFill').style.width=(timeLeft/20*100)+'%';
}
function timeOutQ(){
  document.querySelectorAll('.ans-btn').forEach(b=>b.disabled=true);
}

function selectAns(idx){
  if(selectedAnswer!==null&&selectedAnswer!==undefined)return;
  if(timeLeft<=0)return;
  selectedAnswer=idx;
  clearInterval(timerInt);
  document.querySelectorAll('.ans-btn').forEach(b=>b.disabled=true);
  document.getElementById('ansBtn'+idx).classList.add('selected-temp');
  
  const pts=Math.round(500+(timeLeft/20)*500);
  roomRef.child('answers/'+myId).set({answer:idx,time:timeLeft,points:pts,name:myName});
}

function showReveal(){
  clearInterval(timerInt);
  roomRef.child('correctAnswer').once('value',snap=>{
    const correct=snap.val();
    if(correct===null||correct===undefined)return;
    
    const isCorrect=selectedAnswer===correct;
    const pts=isCorrect?Math.round(500+(timeLeft/20)*500):0;
    
    if(isCorrect){
      myScore+=pts;
      roomRef.child('scores/'+myId).transaction(cur=>(cur||0)+pts);
    }
    
    document.getElementById('questionScreen').classList.remove('active');
    document.getElementById('feedbackScreen').classList.add('active');
    
    document.getElementById('fbIcon').textContent=isCorrect?'✅':'❌';
    document.getElementById('fbTitle').textContent=isCorrect?'إجابة صحيحة!':'إجابة خاطئة';
    document.getElementById('fbTitle').style.color=isCorrect?'#2ecc71':'#e74c3c';
    document.getElementById('fbPoints').textContent=isCorrect?`+${pts} نقطة | مجموعك: ${myScore}`:`مجموعك: ${myScore}`;
    
    if(!isCorrect){
      roomRef.child('questionData/answers').once('value',as=>{
        const answers=as.val();
        if(answers) document.getElementById('fbCorrect').textContent='الإجابة الصحيحة: '+answers[correct];
      });
    } else {
      document.getElementById('fbCorrect').textContent='';
    }
  });
}

function showResults(){
  document.getElementById('feedbackScreen').classList.remove('active');
  document.getElementById('waitScreen').classList.remove('active');
  document.getElementById('questionScreen').classList.remove('active');
  document.getElementById('resultsScreen').classList.add('active');
  
  document.getElementById('myScore').textContent=myScore;
  
  roomRef.child('scores').once('value',snap=>{
    const scores=snap.val()||{};
    roomRef.child('players').once('value',psnap=>{
      const pl=psnap.val()||{};
      const sorted=Object.keys(pl).map(k=>({name:pl[k].name,score:scores[k]||0,isMe:k===myId})).sort((a,b)=>b.score-a.score);
      const myRank=sorted.findIndex(p=>p.isMe)+1;
      const medals=['🥇','🥈','🥉'];
      const rankEl=document.getElementById('rankBadge');
      rankEl.textContent=myRank<=3?`${medals[myRank-1]} المركز ${myRank}`:`المركز ${myRank} من ${sorted.length}`;
      rankEl.style.background=myRank===1?'rgba(255,215,0,0.2)':myRank===2?'rgba(192,192,192,0.15)':'rgba(255,255,255,0.08)';
      rankEl.style.border=`1px solid ${myRank===1?'rgba(255,215,0,0.4)':'rgba(255,255,255,0.15)'}`;
      rankEl.style.color=myRank===1?'#ffd700':'#ccc';
      
      document.getElementById('lbMini').innerHTML='<div style="font-size:0.85rem;font-weight:700;color:#8899aa;margin-bottom:8px;text-align:center">🏅 ترتيب اللاعبين</div>'+
        sorted.slice(0,5).map((p,i)=>`
          <div class="lb-mi-item" style="${p.isMe?'border:1px solid rgba(255,215,0,0.4);background:rgba(255,215,0,0.1);':''}">
            <div class="lb-mi-rank">${medals[i]||(i+1)}</div>
            <div class="lb-mi-name">${p.name}${p.isMe?' (أنت)':''}</div>
            <div class="lb-mi-score">${p.score}</div>
          </div>`).join('');
    });
  });
}
</script>
</body>
</html>
