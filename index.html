<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسابقة القرآن الكريم</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C;
    --gold-light: #F0D080;
    --gold-dark: #8B6914;
    --deep: #0D1B2A;
    --deep2: #1A2F42;
    --deep3: #243B52;
    --white: #F5F0E8;
    --cream: #EDE3CC;
    --green: #2D6A4F;
    --green-light: #52B788;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Cairo', sans-serif;
    background: var(--deep);
    color: var(--white);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Animated background */
  .bg-pattern {
    position: fixed;
    inset: 0;
    background-image: 
      radial-gradient(circle at 20% 50%, rgba(201,168,76,0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(45,106,79,0.1) 0%, transparent 40%),
      radial-gradient(circle at 60% 80%, rgba(201,168,76,0.06) 0%, transparent 40%);
    animation: bgPulse 8s ease-in-out infinite alternate;
  }

  @keyframes bgPulse {
    0% { opacity: 0.5; }
    100% { opacity: 1; }
  }

  .geometric {
    position: fixed;
    inset: 0;
    opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23C9A84C' fill-opacity='1'%3E%3Cpath d='M40 0L80 40L40 80L0 40Z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }

  .container {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 480px;
    padding: 20px;
  }

  /* Logo */
  .logo {
    text-align: center;
    margin-bottom: 32px;
    animation: fadeDown 0.8s ease;
  }

  .logo-icon {
    font-size: 56px;
    margin-bottom: 8px;
    filter: drop-shadow(0 0 20px rgba(201,168,76,0.5));
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .logo h1 {
    font-family: 'Amiri', serif;
    font-size: 28px;
    color: var(--gold);
    text-shadow: 0 0 30px rgba(201,168,76,0.4);
    letter-spacing: 2px;
  }

  .logo p {
    font-size: 13px;
    color: rgba(245,240,232,0.5);
    margin-top: 4px;
    letter-spacing: 1px;
  }

  /* Card */
  .card {
    background: linear-gradient(145deg, rgba(26,47,66,0.9), rgba(13,27,42,0.95));
    border: 1px solid rgba(201,168,76,0.2);
    border-radius: 20px;
    padding: 36px 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(201,168,76,0.1);
    backdrop-filter: blur(10px);
    animation: fadeUp 0.8s ease 0.2s both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-title {
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    color: var(--gold-light);
    margin-bottom: 8px;
  }

  .card-sub {
    text-align: center;
    font-size: 13px;
    color: rgba(245,240,232,0.4);
    margin-bottom: 28px;
  }

  /* Input */
  .input-group {
    margin-bottom: 16px;
  }

  .input-group label {
    display: block;
    font-size: 13px;
    color: var(--gold);
    margin-bottom: 8px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .input-group input {
    width: 100%;
    padding: 14px 18px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(201,168,76,0.25);
    border-radius: 12px;
    color: var(--white);
    font-family: 'Cairo', sans-serif;
    font-size: 16px;
    text-align: right;
    transition: all 0.3s;
    outline: none;
  }

  .input-group input:focus {
    border-color: var(--gold);
    background: rgba(201,168,76,0.08);
    box-shadow: 0 0 0 3px rgba(201,168,76,0.1);
  }

  .input-group input::placeholder {
    color: rgba(245,240,232,0.25);
  }

  /* Button */
  .btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, var(--gold-dark), var(--gold), var(--gold-light));
    border: none;
    border-radius: 12px;
    color: var(--deep);
    font-family: 'Cairo', sans-serif;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    transition: all 0.3s;
    letter-spacing: 1px;
    position: relative;
    overflow: hidden;
    margin-top: 8px;
  }

  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent, rgba(255,255,255,0.2), transparent);
    transform: translateX(-100%);
    transition: transform 0.5s;
  }

  .btn:hover::before { transform: translateX(100%); }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(201,168,76,0.4); }
  .btn:active { transform: translateY(0); }

  .btn-host {
    background: linear-gradient(135deg, #1a4a2e, var(--green), var(--green-light));
    color: var(--white);
    margin-top: 12px;
    font-size: 14px;
    padding: 12px;
  }

  .divider {
    text-align: center;
    color: rgba(245,240,232,0.2);
    font-size: 12px;
    margin: 16px 0 8px;
    position: relative;
  }

  .divider::before, .divider::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 40%;
    height: 1px;
    background: rgba(201,168,76,0.15);
  }
  .divider::before { right: 0; }
  .divider::after { left: 0; }

  /* Waiting screen */
  .waiting-screen {
    display: none;
    text-align: center;
    animation: fadeUp 0.6s ease;
  }

  .waiting-screen.active { display: block; }

  .waiting-avatar {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, var(--gold-dark), var(--gold));
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    margin: 0 auto 20px;
    box-shadow: 0 0 30px rgba(201,168,76,0.3);
  }

  .player-name-display {
    font-family: 'Amiri', serif;
    font-size: 24px;
    color: var(--gold-light);
    margin-bottom: 8px;
  }

  .waiting-dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 24px 0;
  }

  .dot {
    width: 10px; height: 10px;
    background: var(--gold);
    border-radius: 50%;
    animation: bounce 1.4s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  .waiting-text {
    color: rgba(245,240,232,0.5);
    font-size: 14px;
  }

  .players-count {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(201,168,76,0.1);
    border: 1px solid rgba(201,168,76,0.2);
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 13px;
    color: var(--gold);
    margin-top: 16px;
  }

  /* Question screen */
  .question-screen {
    display: none;
  }
  .question-screen.active { display: block; }

  .q-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .q-number {
    font-size: 13px;
    color: var(--gold);
    font-weight: 700;
    background: rgba(201,168,76,0.1);
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid rgba(201,168,76,0.2);
  }

  .timer-circle {
    width: 52px;
    height: 52px;
    position: relative;
  }

  .timer-circle svg {
    transform: rotate(-90deg);
    width: 52px;
    height: 52px;
  }

  .timer-circle .bg { fill: none; stroke: rgba(255,255,255,0.1); stroke-width: 4; }
  .timer-circle .progress { fill: none; stroke: var(--gold); stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset 1s linear; stroke-dasharray: 138; stroke-dashoffset: 0; }

  .timer-num {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 900;
    color: var(--gold);
  }

  .question-text {
    background: linear-gradient(145deg, rgba(201,168,76,0.08), rgba(201,168,76,0.03));
    border: 1px solid rgba(201,168,76,0.15);
    border-radius: 16px;
    padding: 24px 20px;
    font-family: 'Amiri', serif;
    font-size: 20px;
    line-height: 1.8;
    text-align: center;
    color: var(--white);
    margin-bottom: 20px;
  }

  .answers-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .answer-btn {
    padding: 16px 12px;
    border: 2px solid transparent;
    border-radius: 14px;
    font-family: 'Cairo', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s;
    text-align: center;
    min-height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .answer-btn:nth-child(1) { background: rgba(220,53,69,0.15); border-color: rgba(220,53,69,0.3); color: #ff8591; }
  .answer-btn:nth-child(2) { background: rgba(13,110,253,0.15); border-color: rgba(13,110,253,0.3); color: #7eb3ff; }
  .answer-btn:nth-child(3) { background: rgba(25,135,84,0.15); border-color: rgba(25,135,84,0.3); color: #71e5a0; }
  .answer-btn:nth-child(4) { background: rgba(255,193,7,0.15); border-color: rgba(255,193,7,0.3); color: #ffe082; }

  .answer-btn:hover:not(:disabled) {
    transform: scale(1.04);
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
  }

  .answer-btn.correct { background: rgba(25,135,84,0.4) !important; border-color: #52b788 !important; color: #b7f5cd !important; }
  .answer-btn.wrong { background: rgba(220,53,69,0.4) !important; border-color: #f87171 !important; color: #ffc9cc !important; }
  .answer-btn:disabled { cursor: not-allowed; opacity: 0.7; }

  /* Result screen */
  .result-screen { display: none; text-align: center; }
  .result-screen.active { display: block; animation: fadeUp 0.5s ease; }

  .result-emoji { font-size: 64px; margin-bottom: 12px; animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes popIn {
    from { transform: scale(0); }
    to { transform: scale(1); }
  }

  .result-title { font-family: 'Amiri', serif; font-size: 26px; color: var(--gold-light); margin-bottom: 8px; }
  .result-score { font-size: 48px; font-weight: 900; color: var(--gold); }
  .result-sub { font-size: 13px; color: rgba(245,240,232,0.4); margin-top: 4px; }

  .rank-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(201,168,76,0.1);
    border: 1px solid rgba(201,168,76,0.25);
    border-radius: 20px;
    padding: 10px 20px;
    margin-top: 20px;
    font-size: 14px;
    color: var(--gold);
  }

  /* Leaderboard */
  .leaderboard { display: none; }
  .leaderboard.active { display: block; }

  .lb-item {
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 8px;
    animation: slideIn 0.4s ease both;
  }

  .lb-item:nth-child(1) { background: rgba(201,168,76,0.1); border-color: rgba(201,168,76,0.25); }
  .lb-item:nth-child(2) { background: rgba(192,192,192,0.07); border-color: rgba(192,192,192,0.2); }
  .lb-item:nth-child(3) { background: rgba(205,127,50,0.08); border-color: rgba(205,127,50,0.2); }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .lb-rank { font-size: 20px; width: 32px; text-align: center; }
  .lb-name { flex: 1; font-weight: 700; font-size: 15px; }
  .lb-score { font-weight: 900; color: var(--gold); font-size: 18px; }

  .error-msg {
    color: #ff8591;
    font-size: 12px;
    margin-top: 8px;
    display: none;
    text-align: center;
  }
  .error-msg.show { display: block; }

  #join-form { display: block; }
</style>
</head>
<body>
<div class="bg-pattern"></div>
<div class="geometric"></div>

<div class="container">
  <div class="logo">
    <div class="logo-icon">📖</div>
    <h1>مسابقة الموعظة</h1>
    <p>من القرآن الكريم</p>
  </div>

  <div class="card">
    <!-- Join Form -->
    <div id="join-form">
      <div class="card-title">أهلاً وسهلاً! 👋</div>
      <div class="card-sub">أدخل اسمك للمشاركة في المسابقة</div>

      <div class="input-group">
        <label>اسمك</label>
        <input type="text" id="playerName" placeholder="مثال: محمد أحمد" maxlength="20" />
      </div>

      <p class="error-msg" id="errorMsg">الرجاء إدخال اسمك أولاً</p>

      <button class="btn" onclick="joinGame()">انضم للمسابقة 🎯</button>

      <div class="divider">أو</div>
      <button class="btn btn-host" onclick="window.location.href='host.html'">🎮 دخول كـ Host</button>
    </div>

    <!-- Waiting Screen -->
    <div class="waiting-screen" id="waitingScreen">
      <div class="waiting-avatar">🌟</div>
      <div class="player-name-display" id="displayName"></div>
      <div class="waiting-text">انضممت بنجاح!</div>
      <div class="waiting-dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <div class="waiting-text">في انتظار بدء المسابقة...</div>
      <div class="players-count">
        <span>👥</span>
        <span id="playerCountDisplay">1</span>
        <span>لاعب انضم</span>
      </div>
    </div>

    <!-- Question Screen -->
    <div class="question-screen" id="questionScreen">
      <div class="q-header">
        <div class="q-number" id="qNumber">سؤال 1 / 12</div>
        <div class="timer-circle">
          <svg viewBox="0 0 48 48">
            <circle class="bg" cx="24" cy="24" r="22"/>
            <circle class="progress" id="timerCircle" cx="24" cy="24" r="22"/>
          </svg>
          <div class="timer-num" id="timerNum">20</div>
        </div>
      </div>

      <div class="question-text" id="questionText">نص السؤال هنا</div>

      <div class="answers-grid" id="answersGrid">
        <button class="answer-btn" onclick="selectAnswer(0)">الخيار أ</button>
        <button class="answer-btn" onclick="selectAnswer(1)">الخيار ب</button>
        <button class="answer-btn" onclick="selectAnswer(2)">الخيار ج</button>
        <button class="answer-btn" onclick="selectAnswer(3)">الخيار د</button>
      </div>
    </div>

    <!-- Result after each question -->
    <div class="result-screen" id="resultScreen">
      <div class="result-emoji" id="resultEmoji">✅</div>
      <div class="result-title" id="resultTitle">إجابة صحيحة!</div>
      <div class="result-score" id="resultScore">+100</div>
      <div class="result-sub">نقاط</div>
      <div class="rank-badge" id="rankBadge">🏆 المركز الأول</div>
    </div>

    <!-- Final Leaderboard -->
    <div class="leaderboard" id="leaderboardScreen">
      <div style="text-align:center; margin-bottom:20px;">
        <div style="font-size:40px; margin-bottom:8px;">🏆</div>
        <div style="font-family:'Amiri',serif; font-size:22px; color:var(--gold-light);">النتائج النهائية</div>
      </div>
      <div id="leaderboardList"></div>
      <button class="btn" onclick="window.location.href='index.html'" style="margin-top:16px;">العب مجدداً 🔄</button>
    </div>
  </div>
</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getDatabase, ref, set, onValue, push, get } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

  // ضع هنا بيانات Firebase الخاصة بك
  const firebaseConfig = {
    
  apiKey: "AIzaSyB_2J5bXDeBKe0HCf2Bz6wwc7aj8iCU44E",
  authDomain: "quran-quiz-3d972.firebaseapp.com",
  databaseURL: "https://quran-quiz-3d972-default-rtdb.firebaseio.com",
  projectId: "quran-quiz-3d972",
  storageBucket: "quran-quiz-3d972.firebasestorage.app",
  messagingSenderId: "240103544272",
  appId: "1:240103544272:web:97fcdeedd222a72e1a15d5",
  measurementId: "G-FNYRXBTFBY"
};

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let playerKey = null;
  let playerName = '';
  let currentScore = 0;
  let answered = false;
  let timerInterval = null;
  let currentTimeLeft = 20;

  window.joinGame = function() {
    const nameInput = document.getElementById('playerName');
    const name = nameInput.value.trim();
    if (!name) {
      document.getElementById('errorMsg').classList.add('show');
      return;
    }
    playerName = name;
    document.getElementById('errorMsg').classList.remove('show');

    const playerRef = push(ref(db, 'players'));
    playerKey = playerRef.key;

    set(playerRef, {
      name: playerName,
      score: 0,
      lastAnswer: null,
      joinedAt: Date.now()
    });

    document.getElementById('join-form').style.display = 'none';
    document.getElementById('waitingScreen').classList.add('active');
    document.getElementById('displayName').textContent = playerName;

    // Watch players count
    onValue(ref(db, 'players'), (snap) => {
      const count = snap.exists() ? Object.keys(snap.val()).length : 0;
      document.getElementById('playerCountDisplay').textContent = count;
    });

    // Watch game state
    onValue(ref(db, 'game'), (snap) => {
      if (!snap.exists()) return;
      const game = snap.val();

      if (game.status === 'question') {
        showQuestion(game);
      } else if (game.status === 'result') {
        showQuestionResult(game);
      } else if (game.status === 'leaderboard') {
        showLeaderboard(game);
      } else if (game.status === 'waiting') {
        // Back to waiting
      }
    });
  };

  function showQuestion(game) {
    answered = false;
    currentTimeLeft = 20;

    hideAll();
    document.getElementById('questionScreen').classList.add('active');

    const q = game.currentQuestion;
    document.getElementById('qNumber').textContent = `سؤال ${game.qIndex + 1} / ${game.totalQ}`;
    document.getElementById('questionText').textContent = q.text;

    const btns = document.querySelectorAll('.answer-btn');
    btns.forEach((btn, i) => {
      btn.textContent = q.answers[i];
      btn.disabled = false;
      btn.className = 'answer-btn';
    });

    // Timer
    if (timerInterval) clearInterval(timerInterval);
    updateTimer(20);
    timerInterval = setInterval(() => {
      currentTimeLeft--;
      updateTimer(currentTimeLeft);
      if (currentTimeLeft <= 0) {
        clearInterval(timerInterval);
        if (!answered) {
          disableAnswers();
        }
      }
    }, 1000);
  }

  function updateTimer(t) {
    document.getElementById('timerNum').textContent = t;
    const circle = document.getElementById('timerCircle');
    const circumference = 138;
    const offset = circumference - (t / 20) * circumference;
    circle.style.strokeDashoffset = offset;
    if (t <= 5) circle.style.stroke = '#f87171';
    else circle.style.stroke = 'var(--gold)';
  }

  window.selectAnswer = function(index) {
    if (answered) return;
    answered = true;
    clearInterval(timerInterval);

    const timeBonus = Math.round(currentTimeLeft / 20 * 50);
    const answerTime = Date.now();

    disableAnswers();

    set(ref(db, `players/${playerKey}/lastAnswer`), {
      answerIndex: index,
      time: answerTime,
      timeBonus: timeBonus
    });
  };

  function disableAnswers() {
    document.querySelectorAll('.answer-btn').forEach(b => b.disabled = true);
  }

  function showQuestionResult(game) {
    if (timerInterval) clearInterval(timerInterval);
    hideAll();
    document.getElementById('resultScreen').classList.add('active');

    const correct = game.currentQuestion.correct;
    const myAnswer = answered ? game.currentQuestion.correct : -1;

    get(ref(db, `players/${playerKey}/lastAnswer`)).then(snap => {
      let isCorrect = false;
      let points = 0;

      if (snap.exists()) {
        const ans = snap.val();
        isCorrect = ans.answerIndex === correct;
        if (isCorrect) {
          points = 100 + (ans.timeBonus || 0);
          currentScore += points;
          set(ref(db, `players/${playerKey}/score`), currentScore);
        }
      }

      document.getElementById('resultEmoji').textContent = isCorrect ? '✅' : '❌';
      document.getElementById('resultTitle').textContent = isCorrect ? 'إجابة صحيحة! 🎉' : 'إجابة خاطئة';
      document.getElementById('resultScore').textContent = isCorrect ? `+${points}` : '+0';

      // Show rank
      get(ref(db, 'players')).then(pSnap => {
        if (!pSnap.exists()) return;
        const players = Object.entries(pSnap.val())
          .map(([k,v]) => ({...v, key: k}))
          .sort((a,b) => b.score - a.score);
        const rank = players.findIndex(p => p.key === playerKey) + 1;
        document.getElementById('rankBadge').textContent = `📊 المركز ${rank} من ${players.length}`;
      });
    });
  }

  function showLeaderboard(game) {
    if (timerInterval) clearInterval(timerInterval);
    hideAll();
    document.getElementById('leaderboardScreen').classList.add('active');

    get(ref(db, 'players')).then(snap => {
      if (!snap.exists()) return;
      const players = Object.entries(snap.val())
        .map(([k,v]) => ({...v, key: k}))
        .sort((a,b) => b.score - a.score);

      const medals = ['🥇', '🥈', '🥉'];
      const list = document.getElementById('leaderboardList');
      list.innerHTML = '';

      players.forEach((p, i) => {
        const isMe = p.key === playerKey;
        const div = document.createElement('div');
        div.className = 'lb-item';
        div.style.animationDelay = `${i * 0.1}s`;
        if (isMe) div.style.borderColor = 'var(--gold)';
        div.innerHTML = `
          <div class="lb-rank">${medals[i] || (i + 1)}</div>
          <div class="lb-name">${p.name}${isMe ? ' <span style="color:var(--gold);font-size:11px">(أنت)</span>' : ''}</div>
          <div class="lb-score">${p.score}</div>
        `;
        list.appendChild(div);
      });
    });
  }

  function hideAll() {
    document.getElementById('waitingScreen').classList.remove('active');
    document.getElementById('questionScreen').classList.remove('active');
    document.getElementById('resultScreen').classList.remove('active');
    document.getElementById('leaderboardScreen').classList.remove('active');
  }
</script>
</body>
</html>
